<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Image | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:25px auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}.btn{padding:12px 16px;border:0;border-radius:9px;background:#0757ad;color:#fff;font-weight:700;cursor:pointer;margin:7px 4px 7px 0}.btn:disabled{opacity:.5}.info{background:#eef7ff;padding:12px;border-radius:9px;margin:12px 0}.page{display:flex;gap:8px;align-items:center;border:1px solid #ddd;border-radius:9px;padding:8px;margin:8px 0}.page img{width:100px;height:130px;object-fit:contain;background:#f5f5f5}@media(max-width:600px){.page img{width:75px;height:100px}}</style></head><body><main><h1>🖼️ PDF to Image</h1><p>PDF pages को JPG image में convert करके अलग-अलग download करें।</p><input id="pdf" type="file" accept="application/pdf"><div id="info" class="info">PDF select करें।</div><div id="pages"></div><button class="btn" onclick="convert()">🔄 Convert PDF to Images</button><button class="btn" id="zipBtn" onclick="downloadAll()" disabled>⬇️ Download All Images</button><p><a href="index.html">← Home</a> | <a href="image-tools.html">🖼️ Image Tools</a></p></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script type="module">import{getDocument,GlobalWorkerOptions}from'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';let results=[];const $=id=>document.getElementById(id);window.convert=async function(){const f=$('pdf').files[0];if(!f){alert('पहले PDF select करें');return}results=[];$('pages').innerHTML='';$('zipBtn').disabled=true;$('info').textContent='PDF processing हो रही है...';try{const pdf=await getDocument({data:await f.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i),vp=page.getViewport({scale:1.8}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.92));results.push(blob);const url=URL.createObjectURL(blob);const d=document.createElement('div');d.className='page';d.innerHTML='<img src="'+url+'" alt="page '+i+'"><div><b>Page '+i+'</b><br><button class="btn" onclick="downloadOne('+ (results.length-1) +')">⬇️ Download</button></div>';$('pages').appendChild(d)}$('info').textContent=pdf.numPages+' page तैयार हैं।';$('zipBtn').disabled=false}catch(e){$('info').textContent='PDF convert नहीं हो पाई। '+e.message}};window.downloadOne=function(i){const b=results[i];if(!b)return;const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='AJ-Digital-Point-page-'+(i+1)+'.jpg';a.click()};window.downloadAll=function(){results.forEach((_,i)=>setTimeout(()=>downloadOne(i),i*300))};</script></body></html>
