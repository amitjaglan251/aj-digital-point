<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF to Image | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:25px auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}.btn{padding:12px 16px;border:0;border-radius:9px;background:#0757ad;color:#fff;font-weight:700;cursor:pointer;margin:7px 4px 7px 0}.btn:disabled{opacity:.5}.info{background:#eef7ff;padding:12px;border-radius:9px;margin:12px 0}.page{display:flex;gap:10px;align-items:center;border:1px solid #ddd;border-radius:9px;padding:8px;margin:8px 0}.page img{width:100px;height:130px;object-fit:contain;background:#f5f5f5}@media(max-width:600px){.page img{width:75px;height:100px}}</style></head><body><main><h1>🖼️ PDF to Image</h1><p>PDF के pages को JPG में convert करें और एक-एक image या सभी images की ZIP डाउनलोड करें।</p><input id="pdf" type="file" accept="application/pdf"><div id="info" class="info">PDF select करें।</div><button class="btn" id="convertBtn">🔄 Convert PDF to Images</button><button class="btn" id="zipBtn" disabled>📦 Download All Images (ZIP)</button><div id="pages"></div><p><a href="tools-center.html">← Tools Center</a></p></main><script type="module">import{getDocument,GlobalWorkerOptions}from'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs';import JSZip from'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const pdfInput=document.getElementById('pdf'),info=document.getElementById('info'),pagesBox=document.getElementById('pages'),convertBtn=document.getElementById('convertBtn'),zipBtn=document.getElementById('zipBtn');let results=[];function saveBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}convertBtn.addEventListener('click',async()=>{const file=pdfInput.files[0];if(!file){info.textContent='पहले PDF select करें।';return}results=[];pagesBox.innerHTML='';zipBtn.disabled=true;convertBtn.disabled=true;info.textContent='PDF processing हो रही है...';try{const pdf=await getDocument({data:await file.arrayBuffer()}).promise;for(let i=1;i<=pdf.numPages;i++){info.textContent='Page '+i+' / '+pdf.numPages+' convert हो रहा है...';const page=await pdf.getPage(i),vp=page.getViewport({scale:2}),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{alpha:false});canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);await page.render({canvasContext:ctx,viewport:vp}).promise;const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Image create नहीं हुई')),'image/jpeg',0.95));results.push(blob);const url=URL.createObjectURL(blob),row=document.createElement('div');row.className='page';const img=document.createElement('img');img.src=url;const wrap=document.createElement('div');const title=document.createElement('b');title.textContent='Page '+i;const btn=document.createElement('button');btn.className='btn';btn.textContent='⬇️ Download JPG';btn.onclick=()=>saveBlob(blob,'AJ-Digital-Point-page-'+i+'.jpg');wrap.append(title,document.createElement('br'),btn);row.append(img,wrap);pagesBox.appendChild(row)}info.textContent=pdf.numPages+' page तैयार हैं।';zipBtn.disabled=!results.length}catch(e){console.error(e);info.textContent='PDF convert नहीं हो पाई। कृपया valid PDF try करें।'}finally{convertBtn.disabled=false}});zipBtn.addEventListener('click',async()=>{if(!results.length)return;zipBtn.disabled=true;info.textContent='ZIP बनाई जा रही है...';try{const zip=new JSZip();results.forEach((blob,i)=>zip.file('AJ-Digital-Point-page-'+(i+1)+'.jpg',blob));const out=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});saveBlob(out,'AJ-Digital-Point-PDF-Images.zip');info.textContent='ZIP download तैयार है।'}catch(e){console.error(e);info.textContent='ZIP नहीं बन सकी। फिर से try करें।'}finally{zipBtn.disabled=false}});</script></body></html>
