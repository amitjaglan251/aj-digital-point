<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to Text OCR | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:900px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.btn:disabled{opacity:.55}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input,select,textarea{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}textarea{min-height:230px;font-size:15px}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🔤 Image to Text (OCR)</h1><p>Photo या scanned document से text निकालें। Processing browser में होती है।</p><input id="file" type="file" accept="image/*"><select id="lang"><option value="eng">English</option><option value="hin">Hindi</option><option value="eng+hin">Hindi + English</option></select><button class="btn" id="go">🔍 Extract Text</button><button class="btn" id="copy" disabled>📋 Copy Text</button><button class="btn" id="download" disabled>⬇️ Download TXT</button><div class="status" id="status">Image चुनें।</div><textarea id="result" placeholder="Extracted text यहाँ आएगा..."></textarea></div></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>const f=document.getElementById('file'),lang=document.getElementById('lang'),go=document.getElementById('go'),r=document.getElementById('result'),s=document.getElementById('status'),copy=document.getElementById('copy'),download=document.getElementById('download');go.onclick=async()=>{if(!f.files[0]){s.textContent='पहले image चुनें।';return}go.disabled=true;copy.disabled=true;download.disabled=true;r.value='';try{const worker=await Tesseract.createWorker(lang.value,1,{logger:m=>{if(m.status)s.textContent=m.status+' '+(m.progress?Math.round(m.progress*100)+'%':'')}});const res=await worker.recognize(f.files[0]);r.value=res.data.text.trim();await worker.terminate();s.textContent=r.value?'OCR पूरा हुआ।':'Text नहीं मिला। साफ image try करें।';copy.disabled=!r.value;download.disabled=!r.value}catch(e){s.textContent='OCR process नहीं हो सका। साफ image try करें।'}go.disabled=false};copy.onclick=async()=>{await navigator.clipboard.writeText(r.value);s.textContent='Text copy हो गया।'};download.onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.value],{type:'text/plain;charset=utf-8'}));a.download='AJ-DIGITAL-POINT-OCR.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
