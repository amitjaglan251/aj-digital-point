<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to Text OCR | AJ DIGITAL POINT</title><meta name="description" content="AJ DIGITAL POINT Image to Text OCR — image या scanned document से text निकालने का browser-based OCR tool।"><meta name="robots" content="index,follow"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/ocr.html"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:900px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.btn:disabled{opacity:.55}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input,select,textarea{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}textarea{min-height:230px;font-size:15px}</style><style id="easy-back-nav">.easy-back{display:flex;gap:8px;align-items:center;margin:8px auto;max-width:1200px;padding:0 16px;font-size:13px}.easy-back a{color:#123f80;font-weight:800;text-decoration:none}.easy-back a:hover{text-decoration:underline}</style></head><body><main><div class="easy-back"><a href="online-tools.html">← Online Tools</a><span>›</span><b>वापस जाना</b></div><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🔤 Image to Text (OCR)</h1><p>Photo या scanned document से text निकालें। Processing browser में होती है।</p><input id="file" type="file" accept="image/*"><select id="lang"><option value="eng">English</option><option value="hin">Hindi</option><option value="eng+hin">Hindi + English</option></select><button class="btn" id="go">🔍 Extract Text</button><button class="btn" id="copy" disabled>📋 Copy Text</button><button class="btn" id="download" disabled>⬇️ Download TXT</button><div class="status" id="status">Image चुनें।</div><textarea id="result" placeholder="Extracted text यहाँ आएगा..."></textarea></div></main><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script>let downloadUrl='';const f=document.getElementById('file'),lang=document.getElementById('lang'),go=document.getElementById('go'),r=document.getElementById('result'),s=document.getElementById('status'),copy=document.getElementById('copy'),download=document.getElementById('download');go.onclick=async()=>{if(!f.files[0]){s.textContent='पहले image चुनें।';return}go.disabled=true;copy.disabled=true;download.disabled=true;r.value='';let worker=null;try{worker=await Tesseract.createWorker(lang.value,1,{logger:m=>{if(m.status)s.textContent=m.status+' '+(m.progress?Math.round(m.progress*100)+'%':'')}});const res=await worker.recognize(f.files[0]);r.value=res.data.text.trim();s.textContent=r.value?'OCR पूरा हुआ।':'Text नहीं मिला। साफ image try करें।';copy.disabled=!r.value;download.disabled=!r.value}catch(e){s.textContent='OCR process नहीं हो सका। साफ image try करें।'}finally{if(worker){try{await worker.terminate()}catch(_){}}go.disabled=false}};copy.onclick=async()=>{await navigator.clipboard.writeText(r.value);s.textContent='Text copy हो गया।'};download.onclick=()=>{if(!r.value)return;if(downloadUrl)URL.revokeObjectURL(downloadUrl);downloadUrl=URL.createObjectURL(new Blob([r.value],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=downloadUrl;a.download='AJ-DIGITAL-POINT-OCR.txt';document.body.appendChild(a);a.click();a.remove()};window.addEventListener('beforeunload',()=>{if(downloadUrl)URL.revokeObjectURL(downloadUrl)});</script></body></html>
