<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo DPI Converter 72 96 150 200 300 600 DPI | AJ DIGITAL POINT</title>
<meta name="description" content="Convert photos to selectable DPI output with custom physical size and background color in your browser.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/photo-dpi-converter.html">
<link rel="stylesheet" href="style.css">
<style>
main{max-width:900px;margin:24px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:20px;box-shadow:0 5px 18px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{margin-top:14px;padding:15px;border:1px solid #dce5ef;border-radius:12px;background:#fafcff}label{display:block;font-weight:700;margin-bottom:10px}input,select{width:100%;box-sizing:border-box;padding:11px;margin-top:7px;border:1px solid #cbd5e1;border-radius:8px}button{border:0;border-radius:9px;padding:11px 16px;margin:8px 6px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.secondary{background:#555}.status{margin-top:14px;padding:11px;background:#f3f7fb;border-radius:8px}canvas{max-width:100%;margin-top:14px;border:1px solid #ddd}.note{margin-top:14px;padding:12px;background:#fff8df;border-radius:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}main{margin:10px auto;padding:10px}}
</style></head>
<body><main><a href="online-tools.html">← Online Tools</a>
<div class="box"><h1>🎯 Photo DPI Converter</h1><p>Photo को 72, 96, 150, 200, 300 या 600 DPI output में तैयार करें।</p>
<input id="file" type="file" accept="image/*">
<div class="panel"><div class="grid">
<label>DPI<select id="dpi"><option value="72">72 DPI</option><option value="96">96 DPI</option><option value="150">150 DPI</option><option value="200">200 DPI</option><option value="300" selected>300 DPI</option><option value="600">600 DPI</option></select></label>
<label>Physical Width (inch)<input id="width" type="number" min=".1" step=".01" value="2"></label>
<label>Physical Height (inch)<input id="height" type="number" min=".1" step=".01" value="2"></label>
<label>Background<select id="bg"><option value="original">Original</option><option value="white">White</option><option value="black">Black</option><option value="custom">Custom Color</option></select></label>
<label id="colorWrap" style="display:none">Custom Color<input id="color" type="color" value="#ffffff"></label>
</div></div>
<button id="convert">Convert / Preview</button><button id="download" class="secondary" disabled>⬇️ Download JPG</button>
<div class="status" id="status">Photo चुनें और DPI/size सेट करें।</div><canvas id="canvas"></canvas>
<div class="note"><b>ध्यान दें:</b> Output pixel dimensions = physical size × selected DPI. उदाहरण: 2×2 inch at 300 DPI = 600×600 pixels.</div>
</div></main>
<script>
const $=id=>document.getElementById(id),file=$('file'),canvas=$('canvas'),ctx=canvas.getContext('2d'),status=$('status'),download=$('download');let img=null,sourceUrl='';
function render(){if(!img)return;const dpi=Math.max(1,Number($('dpi').value)||300),w=Math.max(1,Math.round((Number($('width').value)||2)*dpi)),h=Math.max(1,Math.round((Number($('height').value)||2)*dpi));canvas.width=w;canvas.height=h;const bg=$('bg').value;if(bg!=='original'){ctx.fillStyle=bg==='custom'?$('color').value:bg;ctx.fillRect(0,0,w,h)}else ctx.clearRect(0,0,w,h);const scale=Math.max(w/img.width,h/img.height),sw=w/scale,sh=h/scale,sx=(img.width-sw)/2,sy=(img.height-sh)/2;ctx.drawImage(img,sx,sy,sw,sh,0,0,w,h);status.textContent='✅ '+w+' × '+h+' pixels at '+dpi+' DPI ('+(w/dpi).toFixed(2)+' × '+(h/dpi).toFixed(2)+' inch)';download.disabled=false}
file.onchange=()=>{const f=file.files[0];if(!f)return;if(sourceUrl)URL.revokeObjectURL(sourceUrl);sourceUrl=URL.createObjectURL(f);img=new Image();img.onload=()=>{status.textContent='✅ Photo loaded.';render()};img.onerror=()=>{status.textContent='❌ Photo load failed.';download.disabled=true};img.src=sourceUrl};
$('convert').onclick=render;$('dpi').onchange=render;$('width').oninput=render;$('height').oninput=render;$('bg').onchange=()=>{$('colorWrap').style.display=$('bg').value==='custom'?'block':'none';render()};$('color').oninput=render;
download.onclick=()=>{if(!img||!canvas.width||!canvas.height)return;const a=document.createElement('a');a.href=canvas.toDataURL('image/jpeg',.95);a.download='AJ-DIGITAL-POINT-'+$('dpi').value+'DPI.jpg';document.body.appendChild(a);a.click();a.remove()};window.addEventListener('beforeunload',()=>{if(sourceUrl)URL.revokeObjectURL(sourceUrl)});
</script></body></html>
