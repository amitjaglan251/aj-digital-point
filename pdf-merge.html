<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Merge | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 16px;margin:7px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.btn.secondary{background:#168a45}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input{padding:10px;width:100%}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>📚 PDF Merge</h1><p>एक से अधिक PDF चुनें और उन्हें एक PDF में जोड़ें।</p><input id="files" type="file" accept="application/pdf" multiple><div><button class="btn" id="merge">Merge PDF</button><button class="btn secondary" id="download" disabled>⬇️ Download PDF</button></div><div class="status" id="status">PDF files चुनें।</div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>let out=null;const f=document.getElementById('files'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('merge').onclick=async()=>{if(!f.files.length)return s.textContent='कम से कम 1 PDF चुनें।';try{const merged=await PDFLib.PDFDocument.create();for(const file of f.files){const src=await PDFLib.PDFDocument.load(await file.arrayBuffer());const pages=await merged.copyPages(src,src.getPageIndices());pages.forEach(p=>merged.addPage(p))}out=await merged.save();d.disabled=false;s.textContent=f.files.length+' PDF merge हो गईं। Download के लिए button दबाएँ।'}catch(e){s.textContent='PDF merge नहीं हो सकी। File को दोबारा check करें।'}};d.onclick=()=>{if(!out)return;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/pdf'}));a.download='AJ-DIGITAL-POINT-Merged.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></body></html>
