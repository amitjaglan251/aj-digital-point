<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Difference Calculator | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:700px;margin:30px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 18px #0001}input{width:100%;padding:12px;box-sizing:border-box;margin:8px 0 16px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#0d6efd;color:#fff;font-weight:700}.result{margin-top:18px;padding:16px;background:#f1f5f9;border-radius:10px;text-align:center;line-height:1.9;font-size:18px}</style></head><body><main><div class="card"><h1>📅 Date Difference Calculator</h1><p>दो तारीखों के बीच exact अंतर निकालें।</p><label>Start Date</label><input id="a" type="date"><label>End Date</label><input id="b" type="date"><button class="btn" id="go">Calculate Difference</button><div class="result" id="r">दो तारीखें चुनें।</div></div></main><script>document.getElementById('go').onclick=()=>{const a=new Date(document.getElementById('a').value+'T00:00:00'),b=new Date(document.getElementById('b').value+'T00:00:00'),r=document.getElementById('r');if(isNaN(a)||isNaN(b))return r.textContent='दोनों तारीखें चुनें।';if(b<a)return r.textContent='End Date, Start Date से पहले नहीं हो सकती।';let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate();if(d<0){m--;d+=new Date(b.getFullYear(),b.getMonth(),0).getDate()}if(m<0){y--;m+=12}const days=Math.round((b-a)/86400000);r.innerHTML=`<b>${y} साल, ${m} महीने, ${d} दिन</b><br>कुल ${days.toLocaleString('en-IN')} दिन`};</script></body></html>
