<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GST Calculator – GST Amount & Total Calculation | AJ DIGITAL POINT</title><meta name="description" content="Free GST Calculator by AJ DIGITAL POINT. Calculate GST amount, basic amount and total amount for common GST rates with simple online calculation."><meta name="robots" content="index,follow"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/gst-calculator.html"><meta property="og:title" content="GST Calculator | AJ DIGITAL POINT"><meta property="og:description" content="Calculate GST amount, basic amount and total amount online with the AJ DIGITAL POINT GST Calculator."><meta property="og:type" content="website"><meta property="og:url" content="https://amitjaglan251.github.io/aj-digital-point/gst-calculator.html"><link rel="stylesheet" href="style.css"><style>main{max-width:700px;margin:30px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 18px #0001}input,select{width:100%;padding:12px;box-sizing:border-box;margin:7px 0 15px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#0d6efd;color:#fff;font-weight:700}.result{margin-top:18px;padding:16px;background:#f1f5f9;border-radius:10px;line-height:1.9;font-size:18px}.back{display:inline-block;margin-bottom:14px}.note{font-size:13px;color:#555;line-height:1.5}</style></head><body><main><a class="back" href="online-tools.html">← Online Tools</a><div class="card"><h1>🧾 GST Calculator</h1><label for="amt">Amount (₹)</label><input id="amt" type="number" min="0" step="0.01" placeholder="1000"><label for="rate">GST Rate</label><select id="rate"><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option></select><label for="type">Calculation Type</label><select id="type"><option value="add">GST जोड़ें (Exclusive)</option><option value="remove">GST निकालें (Inclusive)</option></select><button class="btn" id="go">Calculate GST</button><div class="result" id="r" aria-live="polite">Details भरें।</div><p class="note">यह calculator केवल सामान्य गणना के लिए है। वास्तविक invoice/tax treatment के लिए लागू GST rules और अपने tax professional/official guidance को देखें।</p></div></main><script>const amountInput=document.getElementById('amt'),rateInput=document.getElementById('rate'),typeInput=document.getElementById('type'),result=document.getElementById('r');document.getElementById('go').onclick=()=>{const a=Number(amountInput.value),g=Number(rateInput.value);if(!Number.isFinite(a)||a<0||!Number.isFinite(g)){result.textContent='Amount सही भरें।';return}let base,gst,total;if(typeInput.value==='add'){base=a;gst=a*g/100;total=a+gst}else{total=a;base=a*100/(100+g);gst=a-base}result.innerHTML=`<b>Basic Amount:</b> ₹${base.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>GST (${g}%):</b> ₹${gst.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Amount:</b> ₹${total.toLocaleString('en-IN',{maximumFractionDigits:2})}`};</script></body></html>
