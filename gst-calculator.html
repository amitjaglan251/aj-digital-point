<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GST Calculator | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:700px;margin:30px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 18px #0001}input,select{width:100%;padding:12px;box-sizing:border-box;margin:7px 0 15px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#0d6efd;color:#fff;font-weight:700}.result{margin-top:18px;padding:16px;background:#f1f5f9;border-radius:10px;line-height:1.9;font-size:18px}</style></head><body><main><div class="card"><h1>🧾 GST Calculator</h1><label>Amount (₹)</label><input id="amt" type="number" min="0" step="0.01" placeholder="1000"><label>GST Rate</label><select id="rate"><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option></select><label>Calculation Type</label><select id="type"><option value="add">GST जोड़ें (Exclusive)</option><option value="remove">GST निकालें (Inclusive)</option></select><button class="btn" id="go">Calculate GST</button><div class="result" id="r">Details भरें।</div></div></main><script>document.getElementById('go').onclick=()=>{const a=+amt.value,g=+rate.value,r=document.getElementById('r');if(a<0)return r.textContent='Amount सही भरें।';let base,gst,total;if(type.value==='add'){base=a;gst=a*g/100;total=a+gst}else{total=a;base=a*100/(100+g);gst=a-base}r.innerHTML=`<b>Basic Amount:</b> ₹${base.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>GST (${g}%):</b> ₹${gst.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Amount:</b> ₹${total.toLocaleString('en-IN',{maximumFractionDigits:2})}`};</script></body></html>
