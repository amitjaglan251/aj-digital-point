<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Split | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 16px;margin:7px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input{padding:10px;width:100%}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>✂️ PDF Split</h1><p>PDF से चुने हुए pages को अलग PDF में निकालें। उदाहरण: <b>1-3,5,8-10</b></p><input id="file" type="file" accept="application/pdf"><input id="pages" placeholder="Pages: 1-3,5,8-10" style="margin-top:10px"><button class="btn" id="split">Split PDF</button><div class="status" id="status">PDF चुनें और page numbers डालें।</div><div id="downloads"></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const f=document.getElementById('file'),p=document.getElementById('pages'),s=document.getElementById('status'),out=document.getElementById('downloads');function parse(v,max){const a=new Set();for(const part of v.split(',')){const x=part.trim();if(!x)continue;if(x.includes('-')){let[z,q]=x.split('-').map(Number);if(!Number.isInteger(z)||!Number.isInteger(q)||z<1||q<z)throw 0;for(;z<=q&&z<=max;z++)a.add(z)}else{const n=Number(x);if(!Number.isInteger(n)||n<1||n>max)throw 0;a.add(n)}}return [...a].sort((a,b)=>a-b)}document.getElementById('split').onclick=async()=>{out.innerHTML='';if(!f.files[0])return s.textContent='PDF चुनें।';try{const src=await PDFLib.PDFDocument.load(await f.files[0].arrayBuffer()),nums=parse(p.value,src.getPageCount());if(!nums.length)throw 0;const doc=await PDFLib.PDFDocument.create();const pages=await doc.copyPages(src,nums.map(n=>n-1));pages.forEach(x=>doc.addPage(x));const bytes=await doc.save();const a=document.createElement('a');a.className='btn';a.textContent='⬇️ Download Split PDF';a.download='AJ-DIGITAL-POINT-Split.pdf';a.href=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));out.appendChild(a);s.textContent='Selected pages की नई PDF तैयार है।'}catch(e){s.textContent='Page range सही डालें, जैसे 1-3,5,8-10।'}};</script></body></html>
