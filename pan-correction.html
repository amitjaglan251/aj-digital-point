<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PAN Correction | AJ DIGITAL POINT</title><link rel="stylesheet" href="css/pan-services.css"><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,addDoc,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyDIeZrcPjDvryOhMU4sH-LLeS0usCUY43I',authDomain:'aj-digital-point-aadhaar.firebaseapp.com',projectId:'aj-digital-point-aadhaar',storageBucket:'aj-digital-point-aadhaar.firebasestorage.app',messagingSenderId:'3681003262',appId:'1:3681003262:web:fe5a3e294d80b719c9a7af'};const db=getFirestore(initializeApp(firebaseConfig));document.addEventListener('DOMContentLoaded',()=>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,requestId='PAN-COR-'+Date.now().toString().slice(-8);try{await addDoc(collection(db,'serviceRequests'),{requestId,service:'PAN Correction',applicantName:f.applicantName.value.trim(),mobile:f.mobile.value.trim(),correctionRequired:f.correctionRequired.value.trim(),additionalDetails:f.additionalDetails.value.trim(),status:'Pending',createdAt:serverTimestamp()});alert('Request submitted successfully! Request ID: '+requestId);f.reset()}catch(err){console.error(err);alert('Request submit नहीं हो सकी। Firebase/Firestore settings check करें।')}}));</script></head><body><nav><a href="index.html">Home</a><a href="pan-services.html">PAN Services</a><a href="status-check.html">Check Status</a></nav><main class="container"><div class="card"><div class="icon">✏️</div><h1>PAN Correction / Update</h1><p>Name, DOB और अन्य PAN details correction assistance.</p><form><label>Applicant Name<input name="applicantName" required type="text"></label><label>Mobile Number<input name="mobile" required type="tel" maxlength="10" inputmode="numeric"></label><label>Correction Required<textarea name="correctionRequired" required placeholder="जैसे Name, DOB, Father Name आदि"></textarea></label><label>Additional Details<textarea name="additionalDetails"></textarea></label><button type="submit">Request Correction</button></form><p class="note">Correction संबंधित official PAN process और verification के अनुसार होगी।</p></div></main></body></html>
