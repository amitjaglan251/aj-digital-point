<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo + Sign Joiner | AJ DIGITAL POINT</title><meta name="description" content="AJ DIGITAL POINT Photo + Sign Joiner — photo और signature images को browser में side-by-side या top-to-bottom जोड़ें।"><meta name="robots" content="index,follow"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/photo-sign-joiner.html"><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.top{background:#0b4ea2;color:#fff;padding:15px 5%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:28px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 25px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{font-weight:700}input,select,button{width:100%;padding:12px;margin-top:8px;box-sizing:border-box;border-radius:10px;border:1px solid #ccd4df}button{background:#0b4ea2;color:#fff;font-weight:800;cursor:pointer}canvas{max-width:100%;margin-top:18px;border:1px solid #ddd}.note{color:#657086;line-height:1.6}</style><style id="easy-back-nav">.easy-back{display:flex;gap:8px;align-items:center;margin:8px auto;max-width:1200px;padding:0 16px;font-size:13px}.easy-back a{color:#123f80;font-weight:800;text-decoration:none}.easy-back a:hover{text-decoration:underline}</style></head><body><header class="top"><a href="index.html">AJ DIGITAL POINT</a><a href="online-tools.html">← Tools</a></header><main class="wrap"><div class="easy-back"><a href="online-tools.html">← वापस</a><span>›</span><b>photo sign joiner</b></div><div class="card"><h1>🖇️ Photo + Sign Joiner</h1><p class="note">दो images को एक ही canvas में side-by-side या ऊपर-नीचे जोड़ें। Processing browser में होती है।</p><div class="grid"><label>Photo<input id="photo" type="file" accept="image/*"></label><label>Signature<input id="sign" type="file" accept="image/*"></label></div><label style="display:block;margin-top:15px">Layout<select id="layout"><option value="horizontal">Side by Side</option><option value="vertical">Top to Bottom</option></select></label><button id="join">Join Images</button><a id="download" style="display:none"><button>⬇️ Download Joined Image</button></a><canvas id="canvas"></canvas></div></main><script>const $=id=>document.getElementById(id);let inputUrls=[],outputUrl='';function load(file){return new Promise((res,rej)=>{if(!file)return rej();const i=new Image();i.onload=()=>res(i);i.onerror=rej;const u=URL.createObjectURL(file);inputUrls.push(u);i.src=u})}$('join').onclick=async()=>{if(!$('photo').files[0]||!$('sign').files[0])return alert('Photo और Signature दोनों चुनें।');try{const[a,b]=await Promise.all([load($('photo').files[0]),load($('sign').files[0])]);const c=$('canvas'),g=c.getContext('2d'),w=Math.max(a.width,b.width),h=Math.max(a.height,b.height);if($('layout').value==='horizontal'){c.width=a.width+b.width;c.height=h;g.drawImage(a,0,0);g.drawImage(b,a.width,0)}else{c.width=w;c.height=a.height+b.height;g.drawImage(a,0,0);g.drawImage(b,0,a.height)}c.toBlob(blob=>{if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(blob);$('download').href=outputUrl;$('download').download='AJ-Digital-Point-photo-sign.png';$('download').style.display='block'},'image/png')}catch(e){alert('Images load नहीं हो सकीं।')}}window.addEventListener('beforeunload',()=>{inputUrls.forEach(u=>URL.revokeObjectURL(u));if(outputUrl)URL.revokeObjectURL(outputUrl)});</script></body></html>
