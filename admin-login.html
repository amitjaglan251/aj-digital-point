<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Admin Login | AJ DIGITAL POINT
    </title>

    <link
        rel="stylesheet"
        href="css/admin-login.css">

</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <img
                src="images/logo.png"
                alt="AJ DIGITAL POINT"
                class="login-logo">

            <h1>
                AJ DIGITAL POINT
            </h1>

            <p class="subtitle">
                Aadhaar Assistance Admin Panel
            </p>

            <form id="loginForm">

                <label for="email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Admin email"
                    autocomplete="username"
                    required>


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required>


                <button
                    type="submit"
                    id="loginButton">

                    🔐 Login

                </button>

                <p
                    id="loginMessage"
                    class="message">
                </p>

            </form>

        </div>

    </main>


    <script src="js/aadhaar-update.js"></script>

</body>

</html>
