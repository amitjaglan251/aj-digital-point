<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ID Photo Sheet Maker | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:900px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input,select{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}canvas{max-width:100%;margin-top:15px;border:1px solid #ddd}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🪪 ID Card Photo Sheet Maker</h1><p>Photo upload करके ID-card size की multiple photos की printable sheet बनाएं।</p><input id="file" type="file" accept="image/*"><div class="row"><select id="size"><option value="25x32">25 × 32 mm</option><option value="30x40">30 × 40 mm</option><option value="35x45">35 × 45 mm</option></select><select id="cols"><option value="4">4 photos / row</option><option value="5">5 photos / row</option><option value="6">6 photos / row</option><option value="8">8 photos / row</option></select></div><button class="btn" id="make">Create ID Photo Sheet</button><button class="btn" id="download" disabled>⬇️ Download JPG</button><div class="status" id="status">Photo चुनें।</div><canvas id="canvas"></canvas></div></main><script>const f=document.getElementById('file'),size=document.getElementById('size'),cols=document.getElementById('cols'),c=document.getElementById('canvas'),ctx=c.getContext('2d'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('make').onclick=()=>{if(!f.files[0])return s.textContent='पहले photo चुनें।';const im=new Image();im.onload=()=>{const dpi=300,[mw,mh]=size.value.split('x').map(Number),w=Math.round(mw/25.4*dpi),h=Math.round(mh/25.4*dpi),n=Number(cols.value),gap=18,rows=Math.ceil(12/n);c.width=n*w+(n+1)*gap;c.height=rows*h+(rows+1)*gap;ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<12;i++){const x=gap+(i%n)*(w+gap),y=gap+Math.floor(i/n)*(h+gap),scale=Math.max(w/im.width,h/im.height),sw=w/scale,sh=h/scale,sx=(im.width-sw)/2,sy=(im.height-sh)/2;ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}s.textContent='12 ID photos की sheet तैयार है।';d.disabled=false};im.src=URL.createObjectURL(f.files[0])};d.onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download='AJ-DIGITAL-POINT-ID-Photo-Sheet.jpg';a.click()};</script></body></html>
