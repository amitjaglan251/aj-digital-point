<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:25px auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}.btn{padding:12px 16px;border:0;border-radius:9px;background:#0757ad;color:#fff;font-weight:700;cursor:pointer;margin:7px 4px 7px 0}.btn:disabled{opacity:.5}.info{background:#eef7ff;padding:12px;border-radius:9px;margin:12px 0}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.preview img{width:100%;height:150px;object-fit:contain;background:#f5f5f5;border-radius:8px}@media(max-width:600px){.preview{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>📄 Image to PDF</h1><p>एक या कई photos को एक PDF में बदलें और सीधे Download करें।</p><input id="files" type="file" accept="image/*" multiple><div id="info" class="info">कोई image select नहीं की गई।</div><div id="preview" class="preview"></div><button class="btn" onclick="createPDF()">📄 Create PDF</button><button class="btn" id="download" onclick="downloadPDF()" disabled>⬇️ Download PDF</button><p><a href="index.html">← Home</a> | <a href="image-tools.html">🖼️ Image Tools</a></p></main><script>let selected=[],pdfBlob=null;document.getElementById('files').onchange=e=>{selected=[...e.target.files];pdfBlob=null;document.getElementById('download').disabled=true;document.getElementById('info').textContent=selected.length+' image selected';document.getElementById('preview').innerHTML=selected.map(f=>'<img src="'+URL.createObjectURL(f)+'" alt="preview">').join('')};function createPDF(){if(!selected.length){alert('पहले images select करें');return}let pages=selected.map(f=>{const c=document.createElement('canvas');c.width=1240;c.height=1754;const x=c.getContext('2d');return new Promise(r=>{const im=new Image();im.onload=()=>{x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);const s=Math.min((c.width-80)/im.width,(c.height-80)/im.height);const w=im.width*s,h=im.height*s;x.drawImage(im,(c.width-w)/2,(c.height-h)/2,w,h);r(c.toDataURL('image/jpeg',.9))};im.src=URL.createObjectURL(f)})});Promise.all(pages).then(data=>{const body=data.map((d,i)=>'<div class="page"><img src="'+d+'"></div>').join('');const html='<!doctype html><html><head><title>AJ DIGITAL POINT PDF</title><style>@page{size:A4;margin:0}body{margin:0}.page{width:210mm;height:297mm;display:flex;align-items:center;justify-content:center;page-break-after:always}.page img{max-width:190mm;max-height:277mm}</style></head><body>'+body+'</body></html>';pdfBlob=new Blob([html],{type:'text/html'});document.getElementById('download').disabled=false;const w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),500);document.getElementById('info').textContent='PDF तैयार है। Download button दबाएँ।'})}function downloadPDF(){if(!pdfBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(pdfBlob);a.download='AJ-Digital-Point-Images.html';a.click();document.getElementById('info').textContent='File download शुरू हो गया। Browser में Print → Save as PDF से PDF save करें।'}</script></body></html>
