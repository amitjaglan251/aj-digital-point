<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>main{max-width:900px;margin:25px auto;padding:16px}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}.btn{padding:12px 16px;border:0;border-radius:9px;background:#0757ad;color:#fff;font-weight:700;cursor:pointer;margin:7px 4px 7px 0}.btn:disabled{opacity:.5}.info{background:#eef7ff;padding:12px;border-radius:9px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid select{width:100%;padding:11px}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.preview img{width:100%;height:150px;object-fit:contain;background:#f5f5f5;border-radius:8px}@media(max-width:600px){.grid,.preview{grid-template-columns:repeat(2,1fr)}}@media(max-width:420px){.grid{grid-template-columns:1fr}}</style></head><body><main><div class="card"><a href="tools-center.html">← Tools Center</a><h1>📄 Image to PDF</h1><p>एक या कई photos को high-quality PDF में बदलें।</p><input id="files" type="file" accept="image/*" multiple><div class="grid"><select id="page"><option value="a4">A4</option><option value="letter">Letter</option><option value="fit">Original Image Size</option></select><select id="quality"><option value="0.98">Maximum Quality</option><option value="0.92" selected>High Quality</option><option value="0.82">Balanced</option></select></div><div id="info" class="info">कोई image select नहीं की गई।</div><div id="preview" class="preview"></div><button class="btn" id="create">📄 Create PDF</button><button class="btn" id="download" disabled>⬇️ Download PDF</button></div></main><script>let selected=[],pdfBlob=null;const files=document.getElementById('files'),info=document.getElementById('info'),preview=document.getElementById('preview'),download=document.getElementById('download'),create=document.getElementById('create');files.onchange=e=>{selected=[...e.target.files];pdfBlob=null;download.disabled=true;info.textContent=selected.length+' image selected';preview.innerHTML='';selected.forEach(f=>{const img=document.createElement('img');img.src=URL.createObjectURL(f);preview.appendChild(img)})};function loadImage(file){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{URL.revokeObjectURL(im.src);resolve(im)};im.onerror=reject;im.src=URL.createObjectURL(file)})}create.onclick=async()=>{if(!selected.length){info.textContent='पहले images select करें।';return}create.disabled=true;info.textContent='PDF बनाया जा रहा है...';try{const {jsPDF}=window.jspdf,mode=document.getElementById('page').value,q=+document.getElementById('quality').value;let pdf=null;for(let i=0;i<selected.length;i++){const im=await loadImage(selected[i]);let format=mode==='fit'?[im.width/3.78,im.height/3.78]:mode;let orientation=im.width>im.height?'l':'p';if(!pdf)pdf=new jsPDF({orientation,unit:'mm',format,compress:true});else pdf.addPage(format,orientation);let pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight(),margin=8,scale=Math.min((pageW-2*margin)/im.width,(pageH-2*margin)/im.height);if(mode==='fit')scale=Math.min(pageW/im.width,pageH/im.height);let w=im.width*scale,h=im.height*scale,x=(pageW-w)/2,y=(pageH-h)/2;const canvas=document.createElement('canvas');canvas.width=im.width;canvas.height=im.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);pdf.addImage(canvas.toDataURL('image/jpeg',q),'JPEG',x,y,w,h,undefined,'FAST')}pdfBlob=pdf.output('blob');download.disabled=false;info.textContent='PDF तैयार है। अब Download PDF दबाएँ।'}catch(e){console.error(e);info.textContent='PDF बनाने में समस्या हुई।'}finally{create.disabled=false}};download.onclick=()=>{if(!pdfBlob)return;const url=URL.createObjectURL(pdfBlob),a=document.createElement('a');a.href=url;a.download='AJ-Digital-Point-Images.pdf';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);info.textContent='PDF download शुरू हो गया।'};</script></body></html>
