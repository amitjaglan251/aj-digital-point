<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:800px;margin:40px auto;padding:25px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}input,button{padding:12px;margin:8px 0}button{cursor:pointer}</style></head><body><main><h1>📄 Image to PDF</h1><p>Images select करें और PDF बनाने के लिए Print/Save as PDF का उपयोग करें।</p><input id="files" type="file" accept="image/*" multiple><button onclick="makePDF()">Create PDF</button><div id="out"></div><p><a href="index.html">← Home</a> | <a href="image-resizer.html">🖼️ Image Resizer</a></p></main><script>function makePDF(){const f=[...document.getElementById('files').files];if(!f.length){alert('पहले image select करें');return}const w=window.open('','_blank');w.document.write('<html><head><title>AJ DIGITAL POINT PDF</title><style>img{max-width:100%;display:block;margin:0 auto;page-break-after:always}@media print{img{page-break-after:always}}</style></head><body>');f.forEach(x=>{const u=URL.createObjectURL(x);w.document.write('<img src="'+u+'">')});w.document.write('</body></html>');w.document.close();setTimeout(()=>w.print(),500)}</script></body></html>
