<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>main{max-width:900px;margin:25px auto;padding:16px}.card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 18px #0001}.btn{padding:12px 16px;border:0;border-radius:9px;background:#0757ad;color:#fff;font-weight:700;cursor:pointer;margin:7px 4px 7px 0}.btn.secondary{background:#555}.btn.danger{background:#b42318}.btn:disabled{opacity:.5}.info{background:#eef7ff;padding:12px;border-radius:9px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid label{font-weight:700;font-size:14px}.grid select,.grid input{width:100%;padding:11px;margin-top:5px;box-sizing:border-box}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.item{position:relative;border:1px solid #ddd;border-radius:12px;padding:8px;background:#fafafa}.item img{width:100%;height:150px;object-fit:contain;background:#f5f5f5;border-radius:8px;transition:transform .2s}.item .name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:6px 0}.item .controls{display:flex;gap:4px}.item .controls button{flex:1;border:0;border-radius:7px;padding:7px;cursor:pointer}.drag{cursor:grab}.empty{padding:25px;text-align:center;color:#666;border:2px dashed #ccc;border-radius:10px;grid-column:1/-1}.small{font-size:12px;color:#666}@media(max-width:600px){.preview{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.item img{height:130px}}@media(max-width:420px){main{padding:8px}.card{padding:14px}.preview{grid-template-columns:1fr 1fr}}</style></head><body><main><div class="card"><a href="tools-center.html">← Tools Center</a><h1>📄 Image to PDF</h1><p>कई photos को high-quality PDF में बदलें और PDF से पहले images को arrange करें।</p><input id="files" type="file" accept="image/*" multiple><div class="grid"><label>Page Size<select id="page"><option value="a4">A4</option><option value="letter">Letter</option><option value="fit">Original Image Size</option></select></label><label>Quality<select id="quality"><option value="0.98">Maximum Quality</option><option value="0.92" selected>High Quality</option><option value="0.82">Balanced Quality</option></select></label><label>PDF File Name<input id="filename" type="text" value="AJ-Digital-Point-Images" maxlength="80"></label><label>Page Number<select id="pageNumber"><option value="none">No Page Number</option><option value="bottom">Bottom Center</option></select></label></div><div id="info" class="info">कोई image select नहीं की गई।</div><div id="preview" class="preview"><div class="empty">Images यहाँ दिखाई देंगी</div></div><button class="btn secondary" id="clear" disabled>🗑️ Clear All</button><button class="btn" id="create" disabled>📄 Create PDF</button><button class="btn" id="download" disabled>⬇️ Download PDF</button><button class="btn secondary" id="share" disabled>📤 Share PDF</button><p class="small">Tip: किसी image को ऊपर/नीचे करने के लिए ↑ ↓ दबाएँ। ↻ से rotate और ✕ से remove करें। आप cards को drag करके भी reorder कर सकते हैं।</p></div></main><script>let selected=[],pdfBlob=null;const files=document.getElementById('files'),info=document.getElementById('info'),preview=document.getElementById('preview'),download=document.getElementById('download'),share=document.getElementById('share'),create=document.getElementById('create'),clear=document.getElementById('clear');files.onchange=e=>{selected=[...e.target.files].map(file=>({file,rotation:0}));resetPdf();renderPreview()};function resetPdf(){pdfBlob=null;download.disabled=true;share.disabled=true}function renderPreview(){preview.innerHTML='';if(!selected.length){preview.innerHTML='<div class="empty">Images यहाँ दिखाई देंगी</div>';info.textContent='कोई image select नहीं की गई।';create.disabled=true;clear.disabled=true;return}selected.forEach((item,index)=>{const box=document.createElement('div');box.className='item';box.draggable=true;box.dataset.index=index;const img=document.createElement('img');img.className='drag';img.alt='Image '+(index+1);img.src=URL.createObjectURL(item.file);img.style.transform='rotate('+item.rotation+'deg)';const name=document.createElement('div');name.className='name';name.textContent=(index+1)+'. '+item.file.name;const controls=document.createElement('div');controls.className='controls';controls.innerHTML='<button title="Move up">⬆️</button><button title="Move down">⬇️</button><button title="Rotate">↻</button><button title="Remove">✕</button>';controls.children[0].onclick=()=>move(index,-1);controls.children[1].onclick=()=>move(index,1);controls.children[2].onclick=()=>{selected[index].rotation=(selected[index].rotation+90)%360;resetPdf();renderPreview()};controls.children[3].onclick=()=>{selected.splice(index,1);resetPdf();renderPreview()};box.append(img,name,controls);box.ondragstart=e=>e.dataTransfer.setData('text/plain',index);box.ondragover=e=>e.preventDefault();box.ondrop=e=>{e.preventDefault();const from=+e.dataTransfer.getData('text/plain'),to=index;if(from===to)return;const x=selected.splice(from,1)[0];selected.splice(to,0,x);resetPdf();renderPreview()};preview.appendChild(box)});info.textContent=selected.length+' image'+(selected.length===1?'':'s')+' selected';create.disabled=false;clear.disabled=false}function move(index,delta){const to=index+delta;if(to<0||to>=selected.length)return;[selected[index],selected[to]]=[selected[to],selected[index]];resetPdf();renderPreview()}clear.onclick=()=>{selected=[];files.value='';resetPdf();renderPreview()};function loadImage(file){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{URL.revokeObjectURL(im.src);resolve(im)};im.onerror=reject;im.src=URL.createObjectURL(file)})}function rotatedDimensions(w,h,rotation){return rotation%180===0?[w,h]:[h,w]}create.onclick=async()=>{if(!selected.length)return;create.disabled=true;info.textContent='PDF बनाया जा रहा है...';try{const {jsPDF}=window.jspdf,mode=document.getElementById('page').value,q=+document.getElementById('quality').value,numberMode=document.getElementById('pageNumber').value;let pdf=null;for(let i=0;i<selected.length;i++){const item=selected[i],im=await loadImage(item.file),rotation=item.rotation,[rw,rh]=rotatedDimensions(im.width,im.height,rotation);let format=mode==='fit'?[rw/3.78,rh/3.78]:mode,orientation=rw>rh?'l':'p';if(!pdf)pdf=new jsPDF({orientation,unit:'mm',format,compress:true});else pdf.addPage(format,orientation);const pageW=pdf.internal.pageSize.getWidth(),pageH=pdf.internal.pageSize.getHeight(),margin=mode==='fit'?0:8,scale=Math.min((pageW-2*margin)/(rw),(pageH-2*margin)/(rh)),w=rw*scale,h=rh*scale,x=(pageW-w)/2,y=(pageH-h)/2;const canvas=document.createElement('canvas');if(rotation%180===0){canvas.width=im.width;canvas.height=im.height}else{canvas.width=im.height;canvas.height=im.width}const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.translate(canvas.width/2,canvas.height/2);ctx.rotate(rotation*Math.PI/180);ctx.drawImage(im,-im.width/2,-im.height/2);pdf.addImage(canvas.toDataURL('image/jpeg',q),'JPEG',x,y,w,h,undefined,'FAST');if(numberMode==='bottom'){pdf.setFontSize(9);pdf.text(String(i+1)+' / '+selected.length,pageW/2,pageH-4,{align:'center'})}}pdfBlob=pdf.output('blob');download.disabled=false;share.disabled=!navigator.share;info.textContent='PDF तैयार है। Download या Share करें।'}catch(e){console.error(e);info.textContent='PDF बनाने में समस्या हुई। कृपया images दोबारा चुनें।'}finally{create.disabled=false}};download.onclick=()=>{if(!pdfBlob)return;const url=URL.createObjectURL(pdfBlob),a=document.createElement('a');a.href=url;a.download=((document.getElementById('filename').value.trim()||'AJ-Digital-Point-Images').replace(/\.pdf$/i,'')+'.pdf');a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);info.textContent='PDF download शुरू हो गया।'};share.onclick=async()=>{if(!pdfBlob||!navigator.share)return;try{const file=new File([pdfBlob],'AJ-Digital-Point-Images.pdf',{type:'application/pdf'});if(navigator.canShare&&!navigator.canShare({files:[file]})){info.textContent='इस device/browser में PDF sharing supported नहीं है।';return}await navigator.share({title:'AJ DIGITAL POINT PDF',text:'Image to PDF',files:[file]})}catch(e){if(e.name!=='AbortError')info.textContent='Share नहीं हो पाया।'}};</script></body></html>
