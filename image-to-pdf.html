<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to PDF | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>main{max-width:850px;margin:25px auto;padding:20px;background:#fff;border-radius:16px;box-shadow:0 4px 18px #0001}.btn{padding:12px 16px;border:0;border-radius:9px;background:#0757ad;color:#fff;font-weight:700;cursor:pointer;margin:7px 4px 7px 0}.btn:disabled{opacity:.5}.info{background:#eef7ff;padding:12px;border-radius:9px;margin:12px 0}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.preview img{width:100%;height:150px;object-fit:contain;background:#f5f5f5;border-radius:8px}@media(max-width:600px){.preview{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>📄 Image to PDF</h1><p>एक या कई photos को एक असली PDF file में बदलें और सीधे Download करें।</p><input id="files" type="file" accept="image/*" multiple><div id="info" class="info">कोई image select नहीं की गई।</div><div id="preview" class="preview"></div><button class="btn" id="create" onclick="createPDF()">📄 Create PDF</button><button class="btn" id="download" onclick="downloadPDF()" disabled>⬇️ Download PDF</button><p><a href="index.html">← Home</a> | <a href="image-tools.html">🖼️ Image Tools</a></p></main><script>let selected=[],pdfBlob=null;const files=document.getElementById('files'),info=document.getElementById('info'),preview=document.getElementById('preview'),download=document.getElementById('download');files.onchange=e=>{selected=[...e.target.files];pdfBlob=null;download.disabled=true;info.textContent=selected.length+' image selected';preview.innerHTML='';selected.forEach(f=>{const img=document.createElement('img');img.src=URL.createObjectURL(f);img.alt='preview';preview.appendChild(img)})};function loadImage(file){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{URL.revokeObjectURL(im.src);resolve(im)};im.onerror=reject;im.src=URL.createObjectURL(file)})}async function createPDF(){if(!selected.length){alert('पहले images select करें');return}const btn=document.getElementById('create');btn.disabled=true;info.textContent='PDF बनाया जा रहा है...';try{const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'p',unit:'mm',format:'a4'});for(let i=0;i<selected.length;i++){if(i)pdf.addPage();const im=await loadImage(selected[i]);const pageW=210,pageH=297,margin=10;const scale=Math.min((pageW-2*margin)/im.width,(pageH-2*margin)/im.height);const w=im.width*scale,h=im.height*scale;const x=(pageW-w)/2,y=(pageH-h)/2;const canvas=document.createElement('canvas');canvas.width=im.width;canvas.height=im.height;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(im,0,0);pdf.addImage(canvas.toDataURL('image/jpeg',.92),'JPEG',x,y,w,h,undefined,'FAST')}pdfBlob=pdf.output('blob');download.disabled=false;info.textContent='PDF तैयार है। अब Download PDF दबाएँ।'}catch(e){console.error(e);info.textContent='PDF बनाने में समस्या हुई। फिर से प्रयास करें।';alert('PDF नहीं बन पाया। कृपया images दोबारा select करके कोशिश करें।')}finally{btn.disabled=false}}function downloadPDF(){if(!pdfBlob){alert('पहले Create PDF दबाएँ');return}const url=URL.createObjectURL(pdfBlob);const a=document.createElement('a');a.href=url;a.download='AJ-Digital-Point-Images.pdf';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);info.textContent='PDF download शुरू हो गया।'}</script></body></html>
