<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Age Calculator | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:12px 16px;margin-top:12px;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff;width:100%}.result{margin-top:15px;padding:16px;background:#f3f7fb;border-radius:8px;font-size:18px;line-height:1.8}input{padding:12px;width:100%;box-sizing:border-box;margin-top:8px}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🎂 Age Calculator</h1><p>जन्म तारीख डालकर exact age और अगला birthday जानें।</p><label>Date of Birth</label><input id="dob" type="date"><button class="btn" id="calc">Calculate Age</button><div id="result" class="result">जन्म तारीख चुनें।</div></div></main><script>const dob=document.getElementById('dob'),res=document.getElementById('result');document.getElementById('calc').onclick=()=>{if(!dob.value)return res.textContent='पहले जन्म तारीख चुनें।';const b=new Date(dob.value+'T00:00:00'),now=new Date();if(b>now)return res.textContent='जन्म तारीख आज से आगे नहीं हो सकती।';let y=now.getFullYear()-b.getFullYear(),m=now.getMonth()-b.getMonth(),d=now.getDate()-b.getDate();if(d<0){m--;d+=new Date(now.getFullYear(),now.getMonth(),0).getDate()}if(m<0){y--;m+=12}let next=new Date(now.getFullYear(),b.getMonth(),b.getDate());if(next<now)next.setFullYear(now.getFullYear()+1);const days=Math.round((Date.UTC(next.getFullYear(),next.getMonth(),next.getDate())-Date.UTC(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);res.innerHTML=`<b>आपकी उम्र:</b> ${y} वर्ष, ${m} महीने, ${d} दिन<br><b>अगला Birthday:</b> ${next.toLocaleDateString('en-IN')}<br><b>बाकी:</b> ${days} दिन`};</script></body></html>
