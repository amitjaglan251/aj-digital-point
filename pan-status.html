<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>PAN Status Check | AJ DIGITAL POINT</title><link rel="stylesheet" href="css/pan-services.css"><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,query,where,getDocs,limit}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const firebaseConfig={apiKey:'AIzaSyDIeZrcPjDvryOhMU4sH-LLeS0usCUY43I',authDomain:'aj-digital-point-aadhaar.firebaseapp.com',projectId:'aj-digital-point-aadhaar',storageBucket:'aj-digital-point-aadhaar.firebasestorage.app',messagingSenderId:'3681003262',appId:'1:3681003262:web:fe5a3e294d80b719c9a7af'};const db=getFirestore(initializeApp(firebaseConfig));document.addEventListener('DOMContentLoaded',()=>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,id=f.requestId.value.trim().toUpperCase(),mobile=f.mobile.value.trim(),result=document.getElementById('result');result.textContent='Status checking...';try{const q=query(collection(db,'serviceRequests'),where('requestId','==',id),limit(1)),snap=await getDocs(q);if(snap.empty){result.innerHTML='<div class="status error">❌ Request ID नहीं मिला।</div>';return}const d=snap.docs[0].data();if(mobile&&d.mobile&&d.mobile!==mobile){result.innerHTML='<div class="status error">❌ Mobile number match नहीं हुआ।</div>';return}result.innerHTML='<div class="status"><h2>Request Found</h2><p><b>Request ID:</b> '+(d.requestId||id)+'</p><p><b>Service:</b> '+(d.service||'PAN Service')+'</p><p><b>Status:</b> '+(d.status||'Pending')+'</p></div>'}catch(err){console.error(err);result.innerHTML='<div class="status error">⚠️ Status check नहीं हो सका। बाद में फिर प्रयास करें।</div>'}}));</script><style>.status{margin-top:20px;padding:16px;border-radius:12px;background:#f1f5f9}.status.error{background:#fee2e2}</style></head><body><nav><a href="index.html">Home</a><a href="pan-services.html">PAN Services</a><a href="status-check.html">Check Status</a></nav><main class="container"><div class="card"><div class="icon">🔎</div><h1>PAN Status Check</h1><p>PAN application/request status check assistance.</p><form><label>Request ID<input name="requestId" required type="text" placeholder="अपनी Request ID दर्ज करें"></label><label>Mobile Number<input name="mobile" type="tel" maxlength="10" inputmode="numeric" placeholder="Registered mobile (optional)"></label><button type="submit">Check Status</button></form><div id="result"></div><p class="note">Status आपके application/request record के अनुसार दिखाया जाएगा।</p></div></main></body></html>
