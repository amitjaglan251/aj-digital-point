<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>New PAN Card | AJ DIGITAL POINT</title><link rel="stylesheet" href="css/pan-services.css"></head><body><nav><a href="index.html">Home</a><a href="pan-services.html">PAN Services</a><a href="status-check.html">Check Status</a></nav><main class="container"><div class="card"><div class="icon">🪪</div><h1>New PAN Card</h1><p>नया PAN Card application assistance.</p><form id="form"><label>Applicant Name<input id="name" required type="text"></label><label>Mobile Number<input id="mobile" required type="tel" maxlength="10" inputmode="numeric"></label><label>Email<input id="email" type="email"></label><label>Additional Details<textarea id="details"></textarea></label><button type="submit">Submit Application</button></form><div id="result"></div><p class="note">PAN की final issuance संबंधित official process और verification के अनुसार होगी।</p></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,addDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyDIeZrcPjDvryOhMU4sH-LLeS0usCUY43I',authDomain:'aj-digital-point-aadhaar.firebaseapp.com',projectId:'aj-digital-point-aadhaar',storageBucket:'aj-digital-point-aadhaar.firebasestorage.app',messagingSenderId:'3681003262',appId:'1:3681003262:web:fe5a3e294d80b719c9a7af'}),db=getFirestore(app);form.addEventListener('submit',async e=>{e.preventDefault();const mobile=document.getElementById('mobile').value.trim();if(!/^\d{10}$/.test(mobile))return alert('सही 10 digit mobile number दर्ज करें।');const requestId='AJPAN-'+Date.now().toString().slice(-8);try{await addDoc(collection(db,'serviceRequests'),{requestId,serviceType:'PAN_CARD',service:'New PAN Card',name:name.value.trim(),mobile,email:email.value.trim(),details:details.value.trim(),status:'Pending',createdAt:new Date().toISOString()});result.innerHTML='<p style="padding:12px;background:#ecfdf5">✅ Request submitted.<br>Request ID: <strong>'+requestId+'</strong></p>';form.reset()}catch(err){console.error(err);result.innerHTML='<p style="padding:12px;background:#fee2e2">⚠️ Request save नहीं हुई। Firebase/Firestore rules check करें।</p>'}});</script></body></html>
