<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Scanner | AJ DIGITAL POINT</title><meta name="description" content="AJ DIGITAL POINT QR Code Scanner — camera या image file से QR code scan करके result copy करें।"><meta name="robots" content="index,follow"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/qr-scanner.html"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}#reader{width:100%;max-width:520px;margin:15px auto}textarea{width:100%;min-height:100px;padding:10px;box-sizing:border-box;margin-top:10px}</style><style id="easy-back-nav">.easy-back{display:flex;gap:8px;align-items:center;margin:8px auto;max-width:1200px;padding:0 16px;font-size:13px}.easy-back a{color:#123f80;font-weight:800;text-decoration:none}.easy-back a:hover{text-decoration:underline}</style></head><body><main><div class="easy-back"><a href="online-tools.html">← Online Tools</a><span>›</span><b>वापस जाना</b></div><a href="tools-center.html">← Tools Center</a><div class="box"><h1>📷 QR Code Scanner</h1><p>Camera या image file से QR code scan करें।</p><div id="reader"></div><input id="file" type="file" accept="image/*"><textarea id="result" readonly placeholder="Scanned result यहाँ आएगा..."></textarea><button class="btn" id="copy" disabled>📋 Copy Result</button><div class="status" id="status">Camera शुरू होने के लिए अनुमति दें या QR image चुनें।</div></div></main><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script>let cameraRunning=false;const r=document.getElementById('result'),s=document.getElementById('status'),c=document.getElementById('copy');function done(t){r.value=t;s.textContent='QR successfully scan हो गया।';c.disabled=false}const scanner=new Html5Qrcode('reader');Html5Qrcode.getCameras().then(devices=>{if(devices&&devices.length){scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},done,()=>{}).then(()=>cameraRunning=true).catch(()=>s.textContent='Camera उपलब्ध नहीं है। QR image upload करके scan करें।')}else s.textContent='Camera नहीं मिला। QR image upload करें।'}).catch(()=>s.textContent='Camera permission नहीं मिली। QR image upload करें।');document.getElementById('file').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(scanner.getState&&scanner.getState()===2)await scanner.stop()}catch(_){}scanner.scanFile(file,true).then(done).catch(()=>s.textContent='QR नहीं मिला। साफ QR image try करें।')});c.onclick=async()=>{try{await navigator.clipboard.writeText(r.value)}catch(_){r.focus();r.select();document.execCommand('copy');r.setSelectionRange(0,0)}s.textContent='Result copy हो गया।'};window.addEventListener('pagehide',async()=>{if(cameraRunning){try{await scanner.stop()}catch(_){}}});</script></body></html>
