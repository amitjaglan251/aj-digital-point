<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Scanner | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}#reader{width:100%;max-width:520px;margin:15px auto}textarea{width:100%;min-height:100px;padding:10px;box-sizing:border-box;margin-top:10px}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>📷 QR Code Scanner</h1><p>Camera या image file से QR code scan करें।</p><div id="reader"></div><input id="file" type="file" accept="image/*"><textarea id="result" readonly placeholder="Scanned result यहाँ आएगा..."></textarea><button class="btn" id="copy" disabled>📋 Copy Result</button><div class="status" id="status">Camera शुरू होने के लिए अनुमति दें या QR image चुनें।</div></div></main><script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script><script>const r=document.getElementById('result'),s=document.getElementById('status'),c=document.getElementById('copy');function done(t){r.value=t;s.textContent='QR successfully scan हो गया।';c.disabled=false}const scanner=new Html5Qrcode('reader');Html5Qrcode.getCameras().then(devices=>{if(devices&&devices.length){scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:250,height:250}},done,()=>{}).catch(()=>s.textContent='Camera उपलब्ध नहीं है। QR image upload करके scan करें।')}else s.textContent='Camera नहीं मिला। QR image upload करें।'}).catch(()=>s.textContent='Camera permission नहीं मिली। QR image upload करें।');document.getElementById('file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;scanner.scanFile(file,true).then(done).catch(()=>s.textContent='QR नहीं मिला। साफ QR image try करें।')});c.onclick=async()=>{await navigator.clipboard.writeText(r.value);s.textContent='Result copy हो गया।'};</script></body></html>
