<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Compress | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 16px;margin:7px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input,select{padding:10px;width:100%;margin-top:8px}small{display:block;margin-top:8px;color:#555}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>📦 PDF Compress</h1><p><b>Quality First:</b> PDF को छोटा करते समय quality को प्राथमिकता दी जाती है।</p><input id="file" type="file" accept="application/pdf"><input id="target" type="number" min="1" placeholder="Target size (KB), optional"><select id="mode"><option value="quality">⭐ Maximum Quality — recommended</option><option value="target">🎯 Target Size — only if achievable</option></select><button class="btn" id="go">Compress PDF</button><small>बहुत कम target size पर quality घटाए बिना exact size हासिल करना संभव नहीं हो सकता। Tool quality को खराब करके जबरदस्ती target नहीं बनाएगा।</small><div class="status" id="status">PDF चुनें।</div><div id="download"></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const f=document.getElementById('file'),t=document.getElementById('target'),m=document.getElementById('mode'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('go').onclick=async()=>{d.innerHTML='';if(!f.files[0])return s.textContent='PDF चुनें।';try{const original=f.files[0],src=await PDFLib.PDFDocument.load(await original.arrayBuffer(),{updateMetadata:false,ignoreEncryption:false}),out=await PDFLib.PDFDocument.create();const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p));out.setTitle('AJ DIGITAL POINT');const bytes=await out.save({useObjectStreams:true,addDefaultPage:false,compress:true});const before=original.size,after=bytes.length,target=t.value?Number(t.value)*1024:0;let msg=`Original: ${(before/1024).toFixed(1)} KB | Result: ${(after/1024).toFixed(1)} KB.`;if(after>=before)msg+=' इस PDF में बिना image quality घटाए size कम नहीं हुआ; original quality सुरक्षित रखी गई है।';else msg+=' Quality-first optimization complete.';if(m.value==='target'&&target&&after>target)msg+=` Target ${(target/1024).toFixed(0)} KB था, लेकिन quality सुरक्षित रखते हुए उससे नीचे जाना संभव नहीं था।`;const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.className='btn';a.href=url;a.download='AJ-DIGITAL-POINT-Compressed.pdf';a.textContent='⬇️ Download PDF';d.appendChild(a);s.textContent=msg}catch(e){s.textContent='PDF process नहीं हो सकी। कृपया दूसरी PDF try करें।'}};</script></body></html>
