<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Compress | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 16px;margin:7px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input,select{padding:10px;width:100%;margin-top:8px}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>📦 PDF Compress</h1><p>PDF को optimize करके file size कम करने की कोशिश करें।</p><input id="file" type="file" accept="application/pdf"><select id="level"><option value="low">Normal optimization</option><option value="medium">Maximum browser optimization</option></select><button class="btn" id="go">Compress PDF</button><div class="status" id="status">PDF चुनें।</div><div id="download"></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script><script>const f=document.getElementById('file'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('go').onclick=async()=>{d.innerHTML='';if(!f.files[0])return s.textContent='PDF चुनें।';try{const original=f.files[0],src=await PDFLib.PDFDocument.load(await original.arrayBuffer(),{updateMetadata:false}),out=await PDFLib.PDFDocument.create();const pages=await out.copyPages(src,src.getPageIndices());pages.forEach(p=>out.addPage(p));out.setTitle('AJ DIGITAL POINT - Compressed PDF');const bytes=await out.save({useObjectStreams:true,addDefaultPage:false});const before=original.size,after=bytes.length;const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));const a=document.createElement('a');a.className='btn';a.href=url;a.download='AJ-DIGITAL-POINT-Compressed.pdf';a.textContent='⬇️ Download PDF';d.appendChild(a);s.textContent=`Original: ${(before/1024).toFixed(1)} KB | Result: ${(after/1024).toFixed(1)} KB. Browser में images को recompress नहीं किया जाता, इसलिए हर PDF में size कम होना guaranteed नहीं है।`; }catch(e){s.textContent='PDF process नहीं हो सकी। कृपया दूसरी PDF try करें।'}};</script></body></html>
