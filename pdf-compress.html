<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF Compress | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 16px;margin:7px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input,select{padding:10px;width:100%;margin-top:8px}small{display:block;margin-top:8px;color:#555}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>📦 PDF Compress</h1><p><b>Real Size Reduction:</b> PDF pages को optimized JPEG में बदलकर file size कम किया जाता है।</p><input id="file" type="file" accept="application/pdf"><input id="target" type="number" min="20" placeholder="Target size (KB), optional"><select id="quality"><option value="0.9">⭐ High Quality — recommended</option><option value="0.78">Balanced Quality</option><option value="0.65">More Compression</option><option value="0.5">Maximum Compression</option></select><button class="btn" id="go">Compress PDF</button><small>नोट: बहुत ज्यादा compression में PDF को rasterized image pages में बदला जाता है; इसलिए exact target के लिए quality घट सकती है। Original PDF कभी बदलती नहीं है।</small><div class="status" id="status">PDF चुनें।</div><div id="download"></div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script type="module">const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';const f=document.getElementById('file'),t=document.getElementById('target'),q=document.getElementById('quality'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('go').onclick=async()=>{d.innerHTML='';if(!f.files[0])return s.textContent='PDF चुनें।';try{const original=f.files[0],data=await original.arrayBuffer();s.textContent='PDF पढ़ी जा रही है…';const pdf=await pdfjs.getDocument({data}).promise;let quality=Number(q.value);let scale=1.45;if(quality<=0.65)scale=1.25;if(quality<=0.5)scale=1.05;const pages=[];for(let i=1;i<=pdf.numPages;i++){s.textContent=`Page ${i}/${pdf.numPages} process हो रहा है…`;const page=await pdf.getPage(i);const viewport=page.getViewport({scale});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d',{alpha:false}),viewport}).promise;pages.push({data:canvas.toDataURL('image/jpeg',quality),w:viewport.width,h:viewport.height})}const makePdf=async(qv,sc)=>{const doc=new jspdf.jsPDF({orientation:pages[0].w>pages[0].h?'landscape':'portrait',unit:'pt',format:[pages[0].w,pages[0].h],compress:true});for(let i=0;i<pages.length;i++){if(i)doc.addPage([pages[i].w,pages[i].h],pages[i].w>pages[i].h?'landscape':'portrait');doc.addImage(pages[i].data,'JPEG',0,0,pages[i].w,pages[i].h,undefined,'FAST')}return doc.output('blob')};let blob=await makePdf();const target=t.value?Number(t.value)*1024:0;if(target&&blob.size>target&&quality>0.5){quality=0.65;pages.forEach(p=>{const c=document.createElement('canvas');c.width=p.w;c.height=p.h;const x=c.getContext('2d');const img=new Image();img.src=p.data;x.drawImage(img,0,0);p.data=c.toDataURL('image/jpeg',quality)});blob=await makePdf()}const before=original.size,after=blob.size;const url=URL.createObjectURL(blob);const a=document.createElement('a');a.className='btn';a.href=url;a.download='AJ-DIGITAL-POINT-Compressed.pdf';a.textContent='⬇️ Download PDF';d.appendChild(a);s.textContent=`Original: ${(before/1024).toFixed(1)} KB | Result: ${(after/1024).toFixed(1)} KB | ${after<before?'Size reduced successfully.':'इस PDF का size और कम नहीं हुआ।'}`;}catch(e){console.error(e);s.textContent='PDF compress नहीं हो सकी। कृपया दूसरी PDF try करें।'}};</script></body></html>
