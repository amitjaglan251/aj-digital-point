<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code Generator | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:850px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}textarea,input{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}#qr{margin:18px auto;width:max-content;padding:12px;background:#fff}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🔳 QR Code Generator</h1><p>Text, mobile number, website link या कोई भी information QR में बदलें।</p><textarea id="text" rows="5" placeholder="यहाँ text या URL लिखें..."></textarea><input id="name" placeholder="File name (optional)" value="AJ-DIGITAL-POINT-QR"><button class="btn" id="make">Generate QR</button><button class="btn" id="download" disabled>⬇️ Download PNG</button><div id="qr"></div><div class="status" id="status">Text डालें।</div></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const text=document.getElementById('text'),box=document.getElementById('qr'),d=document.getElementById('download'),s=document.getElementById('status');document.getElementById('make').onclick=()=>{if(!text.value.trim())return s.textContent='पहले text या URL डालें।';box.innerHTML='';new QRCode(box,{text:text.value.trim(),width:400,height:400,correctLevel:QRCode.CorrectLevel.H});d.disabled=false;s.textContent='QR code तैयार है।'};d.onclick=()=>{const img=box.querySelector('img'),canvas=box.querySelector('canvas');const url=img?img.src:canvas.toDataURL('image/png');const a=document.createElement('a');a.href=url;a.download=(document.getElementById('name').value.trim()||'AJ-DIGITAL-POINT-QR')+'.png';a.click()};</script></body></html>
