name: PAN backend scaffold checks

on:
  pull_request:
    branches: [main]
    paths:
      - "pan-api-backend/**"
      - ".github/workflows/pan-backend-check.yml"
  push:
    branches: [feat/pan-secure-backend-scaffold]
    paths:
      - "pan-api-backend/**"
      - ".github/workflows/pan-backend-check.yml"

permissions:
  contents: read

jobs:
  safe-default-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pan-api-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: npm run check
      - name: Safe-default smoke test
        run: node --test
