name: Live Website Browser Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Wait for Pages deployment and test desktop/mobile rendering
        run: |
          mkdir -p browser-test-artifacts
          cat > browser-test-artifacts/live-site-test.mjs <<'EOF'
          import { chromium } from 'playwright';
          const base = 'https://amitjaglan251.github.io/aj-digital-point/';
          const browser = await chromium.launch({ headless: true });
          const errors = [];
          const report = { base, attempts: 0, consoleErrors: [], failedRequests: [], checks: {} };
          try {
            const page = await browser.newPage({ viewport: { width: 1365, height: 900 } });
            page.on('pageerror', e => errors.push(String(e)));
            page.on('console', msg => { if (msg.type() === 'error') errors.push(msg.text()); });
            page.on('requestfailed', req => report.failedRequests.push({ url: req.url(), error: req.failure()?.errorText }));
            let ready = false;
            for (let attempt = 1; attempt <= 12; attempt++) {
              report.attempts = attempt;
              try {
                await page.goto(base + 'latest-jobs.html?browserSmoke=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
                await page.waitForTimeout(2500);
                const count = await page.locator('#app .job-card').count();
                const title = await page.locator('.jobs-head h1').textContent().catch(() => '');
                if (count > 0 && (title || '').includes('Latest Jobs')) { ready = true; break; }
              } catch (e) { report.lastNavigationError = String(e); }
              await page.waitForTimeout(10000);
            }
            if (!ready) throw new Error('Live Jobs page did not render job cards after 12 attempts.');
            report.checks.jobsPageTitle = await page.locator('.jobs-head h1').innerText();
            report.checks.desktopCards = await page.locator('#app .job-card').count();
            report.checks.qualityScriptLoaded = await page.locator('script[src*="job-data-quality-fixes.js"]').count() > 0;
            report.checks.centralDatasetLoaded = await page.locator('script[src*="central-jobs.js"]').count() > 0;
            report.checks.logoLoaded = await page.locator('.brand img').evaluate(img => ({ complete: img.complete, naturalWidth: img.naturalWidth }));
            if (!report.checks.qualityScriptLoaded || !report.checks.centralDatasetLoaded) throw new Error('Required job data scripts are not present in the live DOM.');
            if (!report.checks.desktopCards) throw new Error('No job cards rendered on desktop.');

            const detailHref = await page.locator('#app .job-card a[href*="job-details.html?job="]').first().getAttribute('href');
            if (!detailHref) throw new Error('No job details link found on rendered cards.');
            await page.goto(new URL(detailHref, base).href, { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => {
              const el = document.querySelector('#jobTitle');
              return el && el.textContent.trim().length > 0 && !/not found|undefined|null/i.test(el.textContent);
            }, { timeout: 15000 });
            report.checks.detailTitle = await page.locator('#jobTitle').innerText();
            report.checks.detailLinkCount = await page.locator('#linkGrid a').count();
            report.checks.detailPageRendered = true;
            await page.screenshot({ path: 'browser-test-artifacts/job-details-desktop.png', fullPage: true });

            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto(base + 'latest-jobs.html?browserSmokeMobile=' + Date.now(), { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => document.querySelectorAll('#app .job-card').length > 0, { timeout: 20000 });
            report.checks.mobileCards = await page.locator('#app .job-card').count();
            report.checks.mobileViewportWidth = await page.evaluate(() => ({ innerWidth, documentWidth: document.documentElement.scrollWidth }));
            report.checks.mobileHorizontalOverflow = report.checks.mobileViewportWidth.documentWidth > report.checks.mobileViewportWidth.innerWidth + 2;
            await page.screenshot({ path: 'browser-test-artifacts/latest-jobs-mobile.png', fullPage: true });
            report.consoleErrors = errors;
            await page.evaluate(() => {
              const el = document.createElement('pre');
              el.id = 'browser-verification-result';
              el.textContent = 'BROWSER_VERIFICATION=' + JSON.stringify(window.__browserVerificationResult || {});
              document.body.appendChild(el);
            }).catch(() => {});
            await import('node:fs/promises').then(fs => fs.writeFile('browser-test-artifacts/report.json', JSON.stringify(report, null, 2)));
            if (errors.length) throw new Error('Browser console/page errors detected: ' + errors.join(' | '));
            if (report.checks.mobileHorizontalOverflow) throw new Error('Mobile layout has horizontal overflow.');
            if (!report.checks.logoLoaded?.naturalWidth) throw new Error('Header logo failed to load.');
            console.log(JSON.stringify(report, null, 2));
          } finally {
            await browser.close();
          }
          EOF
          node browser-test-artifacts/live-site-test.mjs

      - name: Upload browser screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-site-browser-verification
          path: browser-test-artifacts/
          if-no-files-found: warn
