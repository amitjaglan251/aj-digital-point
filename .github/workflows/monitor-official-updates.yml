name: Monitor official updates
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: official-updates-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Scan configured official sources
        run: python scripts/monitor_official_updates.py
      - name: Commit changed update feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add auto-updates.html auto-updates.json data/official_updates_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh automatically detected official updates"
            git push
          else
            echo "No update-feed changes to commit."
          fi
