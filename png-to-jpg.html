<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PNG to JPG | AJ DIGITAL POINT</title><meta name="description" content="AJ DIGITAL POINT PNG to JPG Converter — PNG, JPG और WEBP images को browser में JPG format में convert करें।"><meta name="robots" content="index,follow"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/png-to-jpg.html"><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.top{background:#0b4ea2;color:#fff;padding:15px 5%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:800px;margin:28px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 25px #0001}input,button{width:100%;padding:13px;margin-top:12px;border-radius:10px;border:1px solid #ccd4df}button{background:#0b4ea2;color:#fff;font-weight:800;cursor:pointer}img{max-width:100%;margin-top:18px}.note{color:#657086;line-height:1.6}</style><style id="easy-back-nav">.easy-back{display:flex;gap:8px;align-items:center;margin:8px auto;max-width:1200px;padding:0 16px;font-size:13px}.easy-back a{color:#123f80;font-weight:800;text-decoration:none}.easy-back a:hover{text-decoration:underline}</style></head><body><header class="top"><a href="index.html">AJ DIGITAL POINT</a><a href="online-tools.html">← Tools</a></header><main class="wrap"><div class="easy-back"><a href="online-tools.html">← Online Tools</a><span>›</span><b>वापस जाना</b></div><div class="card"><h1>🔄 PNG to JPG Converter</h1><p class="note">Image आपके browser में convert होती है। File server पर upload नहीं होती।</p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button id="convert">Convert to JPG</button><a id="download" style="display:none"><button>⬇️ Download JPG</button></a><img id="preview"></div></main><script>const f=document.getElementById('file'),c=document.getElementById('convert'),p=document.getElementById('preview'),d=document.getElementById('download');let inputUrl='',outputUrl='';c.onclick=()=>{if(!f.files[0])return alert('पहले image चुनें।');const im=new Image();im.onload=()=>{const x=document.createElement('canvas');x.width=im.width;x.height=im.height;const g=x.getContext('2d');if(!g)return alert('Canvas उपलब्ध नहीं है।');g.fillStyle='#fff';g.fillRect(0,0,x.width,x.height);g.drawImage(im,0,0);x.toBlob(b=>{if(!b){alert('JPG नहीं बन सकी।');return}if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(b);p.src=outputUrl;d.href=outputUrl;d.download='AJ-Digital-Point-'+Date.now()+'.jpg';d.style.display='block'},'image/jpeg',.92)};im.onerror=()=>alert('Image load नहीं हो सकी।');if(inputUrl)URL.revokeObjectURL(inputUrl);inputUrl=URL.createObjectURL(f.files[0]);im.src=inputUrl}window.addEventListener('beforeunload',()=>{if(inputUrl)URL.revokeObjectURL(inputUrl);if(outputUrl)URL.revokeObjectURL(outputUrl)});</script></body></html>
