<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Calculator | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><style>main{max-width:700px;margin:30px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 18px #0001}input{width:100%;padding:12px;box-sizing:border-box;margin:7px 0 15px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#0d6efd;color:#fff;font-weight:700}.result{margin-top:18px;padding:16px;background:#f1f5f9;border-radius:10px;line-height:1.9;font-size:18px}</style></head><body><main><div class="card"><h1>💰 EMI Calculator</h1><label>Loan Amount (₹)</label><input id="p" type="number" min="0" placeholder="500000"><label>Annual Interest Rate (%)</label><input id="rate" type="number" min="0" step="0.01" placeholder="10"><label>Loan Tenure (Years)</label><input id="years" type="number" min="1" step="1" placeholder="5"><button class="btn" id="go">Calculate EMI</button><div class="result" id="r">Details भरें।</div></div></main><script>document.getElementById('go').onclick=()=>{const P=+p.value,annual=+rate.value,nYears=+years.value,r=document.getElementById('r');if(P<=0||annual<0||nYears<=0)return r.textContent='सभी details सही भरें।';const n=nYears*12,rm=annual/1200;const emi=rm===0?P/n:P*rm*Math.pow(1+rm,n)/(Math.pow(1+rm,n)-1);const total=emi*n,interest=total-P;r.innerHTML=`<b>Monthly EMI:</b> ₹${emi.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Interest:</b> ₹${interest.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Payment:</b> ₹${total.toLocaleString('en-IN',{maximumFractionDigits:2})}`};</script></body></html>
