<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EMI Calculator | AJ DIGITAL POINT</title><meta name="description" content="AJ DIGITAL POINT EMI Calculator से loan amount, interest rate और tenure के आधार पर अनुमानित EMI निकालें।"><meta name="robots" content="index,follow"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/emi-calculator.html"><link rel="stylesheet" href="style.css"><style>main{max-width:700px;margin:30px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:16px;box-shadow:0 5px 18px #0001}input{width:100%;padding:12px;box-sizing:border-box;margin:7px 0 15px}.btn{width:100%;padding:12px;border:0;border-radius:9px;background:#0d6efd;color:#fff;font-weight:700}.result{margin-top:18px;padding:16px;background:#f1f5f9;border-radius:10px;line-height:1.9;font-size:18px}.back{display:inline-block;margin-bottom:14px}.note{font-size:13px;color:#555;line-height:1.5}</style></head><body><main><a class="back" href="online-tools.html">← Online Tools</a><div class="card"><h1>💰 EMI Calculator</h1><label for="p">Loan Amount (₹)</label><input id="p" type="number" min="0" step="0.01" placeholder="500000"><label for="rate">Annual Interest Rate (%)</label><input id="rate" type="number" min="0" step="0.01" placeholder="10"><label for="years">Loan Tenure (Years)</label><input id="years" type="number" min="1" step="1" placeholder="5"><button class="btn" id="go">Calculate EMI</button><div class="result" id="r" aria-live="polite">Details भरें।</div><p class="note">यह calculator अनुमानित EMI के लिए है। वास्तविक EMI में lender के terms, fees, taxes या अन्य charges अलग हो सकते हैं।</p></div></main><script>const principalInput=document.getElementById('p'),rateInput=document.getElementById('rate'),yearsInput=document.getElementById('years'),result=document.getElementById('r');document.getElementById('go').onclick=()=>{const P=Number(principalInput.value),annual=Number(rateInput.value),nYears=Number(yearsInput.value);if(!Number.isFinite(P)||P<=0||!Number.isFinite(annual)||annual<0||!Number.isFinite(nYears)||nYears<=0){result.textContent='सभी details सही भरें।';return}const n=nYears*12,rm=annual/1200;const emi=rm===0?P/n:P*rm*Math.pow(1+rm,n)/(Math.pow(1+rm,n)-1);const total=emi*n,interest=total-P;result.innerHTML=`<b>Monthly EMI:</b> ₹${emi.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Interest:</b> ₹${interest.toLocaleString('en-IN',{maximumFractionDigits:2})}<br><b>Total Payment:</b> ₹${total.toLocaleString('en-IN',{maximumFractionDigits:2})}`};</script></body></html>
