<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker Pro | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:980px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.btn.secondary{background:#555}.panel{margin-top:14px;padding:15px;border:1px solid #dce5ef;border-radius:12px;background:#fafcff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}.hidden{display:none!important}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}.small{font-size:12px;color:#64748b}canvas{max-width:100%;margin-top:15px;border:1px solid #ddd;touch-action:none}.guideWrap{position:relative;display:inline-block;max-width:100%}.guide{position:absolute;inset:0;pointer-events:none}.guide:before{content:'';position:absolute;left:25%;right:25%;top:18%;bottom:15%;border:2px dashed #0b4ea2;border-radius:50%}.guide:after{content:'Eyes / Face Guide';position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:12px;background:#fff9;padding:3px 7px;border-radius:5px}.tools{display:flex;flex-wrap:wrap;gap:6px}.tools .btn{margin:0}.check{display:flex;align-items:center;gap:8px;margin-top:8px}.check input{width:auto;margin:0}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🪪 Passport Photo Maker Pro</h1><p>Passport/Visa photo को align, edit, background change और print करें।</p><input id="file" type="file" accept="image/*"><div class="panel"><h3>🎯 Face Alignment</h3><div class="check"><input id="guide" type="checkbox" checked><label for="guide">Face Position Guide दिखाएँ</label></div><div class="check"><input id="autoAlign" type="checkbox"><label for="autoAlign">Auto Face Alignment</label></div><div class="tools"><button class="btn secondary" id="zoomOut">− Zoom</button><button class="btn secondary" id="zoomIn">+ Zoom</button><button class="btn secondary" id="center">🎯 Center</button><button class="btn secondary" id="resetEditor">↺ Reset Editor</button></div><p class="small">Auto alignment browser में face को detect करके crop को center करने की कोशिश करता है।</p></div><div class="panel"><h3>🎨 Background</h3><div class="row"><label>Background Type<select id="bgType"><option value="white">White</option><option value="lightblue">Light Blue</option><option value="blue">Blue</option><option value="red">Red</option><option value="grey">Light Grey</option><option value="custom">Custom Color</option><option value="gradient">Soft Gradient</option><option value="transparent">Transparent</option><option value="image">Background Image</option></select></label><label id="bgColorWrap" class="hidden">Custom Color<input id="bgColor" type="color" value="#ffffff"></label></div><div id="bgImageWrap" class="hidden"><label>Background Image<input id="bgImage" type="file" accept="image/*"></label></div><button class="btn secondary" id="removeBg">✂️ Remove Background Automatically</button></div><div class="panel"><h3>📐 Photo & Print</h3><div class="row"><label>Photo Size<select id="size"><option value="35x45">35 × 45 mm</option><option value="2x2">2 × 2 inch</option><option value="25x35">25 × 35 mm</option><option value="custom">Custom Size</option></select></label><label id="customSizeWrap" class="hidden">Custom W × H (mm)<input id="customSize" value="35x45" placeholder="35x45"></label></div><div class="row"><label>Photos per row<select id="layout"><option value="1">👤 Single Photo</option><option value="2">👥 2 Photos</option><option value="custom">🔢 Custom</option><option value="4">4 Photos</option><option value="5">5 Photos</option><option value="6">6 Photos</option></select></label><label id="customRowsWrap" class="hidden">Custom columns<input id="customRows" type="number" min="1" max="10" value="3"></label></div><label>Print Sheet<select id="paper"><option value="a4">A4</option><option value="4x6">4 × 6 inch</option><option value="5x7">5 × 7 inch</option></select></label><label class="check"><input id="border" type="checkbox"><span>Photo Border</span></label></div><div class="tools"><button class="btn" id="make">Create Sheet</button><button class="btn" id="print">🖨️ Print Preview</button><button class="btn" id="download" disabled>⬇️ Download JPG</button><button class="btn secondary" id="preset">💾 Save Preset</button><button class="btn secondary" id="clearPreset">🧹 Clear Preset</button></div><div class="status" id="status">Photo चुनें।</div><div class="guideWrap"><canvas id="canvas"></canvas><div id="guideLayer" class="guide"></div></div></div></main><script type="module">import{removeBackground as aiRemoveBackground}from'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';const $=id=>document.getElementById(id),f=$('file'),c=$('canvas'),ctx=c.getContext('2d'),s=$('status'),d=$('download');let sourceFile=null,processedUrl=null,bgImageObj=null,zoom=1,offsetX=0,offsetY=0,faceBox=null;const bgColors={white:'#fff',lightblue:'#dff1ff',blue:'#1976d2',red:'#e53935',grey:'#eee'};function show(){ $('bgColorWrap').classList.toggle('hidden',$('bgType').value!=='custom');$('bgImageWrap').classList.toggle('hidden',$('bgType').value!=='image');$('customRowsWrap').classList.toggle('hidden',$('layout').value!=='custom');$('customSizeWrap').classList.toggle('hidden',$('size').value!=='custom');$('guideLayer').style.display=$('guide').checked?'block':'none'}function count(){return $('layout').value==='custom'?Math.max(1,Math.min(10,Number($('customRows').value)||1)):Number($('layout').value)}function dims(){const dpi=300,v=$('size').value;if(v==='35x45')return [Math.round(35/25.4*dpi),Math.round(45/25.4*dpi)];if(v==='2x2')return [600,600];if(v==='25x35')return [Math.round(25/25.4*dpi),Math.round(35/25.4*dpi)];const p=$('customSize').value.split('x').map(Number);return [Math.round((p[0]||35)/25.4*dpi),Math.round((p[1]||45)/25.4*dpi)]}function load(url){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url})}async function cutout(){if(processedUrl)return true;if(!sourceFile)return false;s.textContent='✂️ Background remove हो रहा है...';try{const b=await aiRemoveBackground(sourceFile,{output:{format:'image/png'}});processedUrl=URL.createObjectURL(b);return true}catch(e){s.textContent='❌ Background removal failed.';return false}}async function detectFace(im){if(!$('autoAlign').checked)return null;try{if(!('FaceDetector'in window))return null;const fd=new FaceDetector({fastMode:true,maxDetectedFaces:1});const fs=await fd.detect(im);return fs[0]?.boundingBox||null}catch(e){return null}}function drawBg(x,y,w,h){const t=$('bgType').value;if(t==='transparent')return;if(t==='image'&&bgImageObj){const sc=Math.max(w/bgImageObj.width,h/bgImageObj.height),sw=w/sc,sh=h/sc;ctx.drawImage(bgImageObj,(bgImageObj.width-sw)/2,(bgImageObj.height-sh)/2,sw,sh,x,y,w,h);return}if(t==='gradient'){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#fff');g.addColorStop(1,'#dff1ff');ctx.fillStyle=g}else ctx.fillStyle=t==='custom'?$('bgColor').value:(bgColors[t]||'#fff');ctx.fillRect(x,y,w,h)}async function render(){if(!sourceFile)return;s.textContent='Sheet तैयार हो रही है...';const im=await load(processedUrl||URL.createObjectURL(sourceFile));faceBox=await detectFace(im);const [w,h]=dims(),n=count(),gap=20;c.width=n*w+(n+1)*gap;c.height=h+2*gap;ctx.clearRect(0,0,c.width,c.height);if($('bgType').value!=='transparent'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}for(let i=0;i<n;i++){const x=gap+i*(w+gap),y=gap;drawBg(x,y,w,h);let scale=Math.max(w/im.width,h/im.height)*zoom,sw=w/scale,sh=h/scale,sx=(im.width-sw)/2-offsetX/scale,sy=(im.height-sh)/2-offsetY/scale;if(faceBox&&$('autoAlign').checked){const fx=faceBox.x+faceBox.width/2,fy=faceBox.y+faceBox.height/2;sx=Math.max(0,Math.min(im.width-sw,fx-sw/2));sy=Math.max(0,Math.min(im.height-sh,fy-sh*.42))}ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h);ctx.restore();if($('border').checked){ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h)}}s.textContent=`✅ ${n} photo${n>1?'s':''} ready.`;d.disabled=false}f.onchange=()=>{sourceFile=f.files[0]||null;processedUrl=null;zoom=1;offsetX=offsetY=0;s.textContent=sourceFile?'Photo selected. Settings चुनें।':'Photo चुनें।'};$('bgType').onchange=async()=>{show();if(sourceFile&&$('bgType').value!=='white'&&!(await cutout()))return;render()};$('bgColor').oninput=()=>sourceFile&&render();$('bgImage').onchange=()=>{if(!$('bgImage').files[0])return;const i=new Image();i.onload=()=>{bgImageObj=i;render()};i.src=URL.createObjectURL($('bgImage').files[0])};$('removeBg').onclick=async()=>{if(await cutout()){s.textContent='✅ Background removed.';render()}};$('make').onclick=render;$('guide').onchange=show;$('autoAlign').onchange=render;$('size').onchange=()=>{show();render()};$('customSize').oninput=render;$('layout').onchange=()=>{show();render()};$('customRows').oninput=render;$('border').onchange=render;$('zoomIn').onclick=()=>{zoom=Math.min(2.5,zoom+.1);render()};$('zoomOut').onclick=()=>{zoom=Math.max(.6,zoom-.1);render()};$('center').onclick=()=>{offsetX=offsetY=0;render()};$('resetEditor').onclick=()=>{zoom=1;offsetX=offsetY=0;$('autoAlign').checked=false;render()};c.addEventListener('pointermove',e=>{if(e.buttons!==1)return;offsetX+=(e.movementX||0);offsetY+=(e.movementY||0);render()});$('print').onclick=()=>{if(!sourceFile)return;const w=window.open('','_blank');w.document.write('<title>AJ Digital Point Print Preview</title><img style="max-width:100%" src="'+c.toDataURL('image/jpeg',.95)+'"><script>window.onload=()=>window.print()<\\/script>');w.document.close()};d.onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download='AJ-DIGITAL-POINT-Passport-Photo.jpg';a.click()};$('preset').onclick=()=>{localStorage.setItem('ajPassportPreset',JSON.stringify({size:$('size').value,customSize:$('customSize').value,layout:$('layout').value,customRows:$('customRows').value,paper:$('paper').value,bgType:$('bgType').value,bgColor:$('bgColor').value,border:$('border').checked}));s.textContent='💾 Preset saved.'};$('clearPreset').onclick=()=>{localStorage.removeItem('ajPassportPreset');s.textContent='🧹 Preset cleared.'};try{const p=JSON.parse(localStorage.getItem('ajPassportPreset')||'null');if(p){for(const k of ['size','customSize','layout','customRows','paper','bgType','bgColor'])if(p[k]!=null&&$(k))$(k).value=p[k];if(p.border!=null)$('border').checked=p.border}}catch{}show();</script></body></html>
