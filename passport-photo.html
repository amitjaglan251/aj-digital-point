<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Studio | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:980px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.btn.secondary{background:#555}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}.panel{margin-top:14px;padding:15px;border:1px solid #dce5ef;border-radius:12px;background:#fafcff}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,select{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}canvas{max-width:100%;margin-top:15px;border:1px solid #ddd}.hidden{display:none!important}.small{font-size:12px;color:#666}.checks{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px}.checks label{display:flex;align-items:center;gap:5px}.checks input{width:auto;margin:0}.studio{position:relative;display:inline-block;max-width:100%}.guide{position:absolute;inset:0;pointer-events:none;display:none}.guide:before{content:"";position:absolute;left:50%;top:18%;height:62%;border-left:1px dashed #0b4ea2}.guide:after{content:"FACE / EYES GUIDE";position:absolute;left:50%;top:28%;transform:translateX(-50%);border:1px dashed #0b4ea2;border-radius:50%;width:44%;height:48%;display:flex;align-items:flex-start;justify-content:center;font-size:11px;color:#0b4ea2;background:#0b4ea211}.studio.showGuide .guide{display:block}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🪪 Passport Photo Studio Pro</h1><p>Passport/Visa photo size, background, face guide, editing and A4 print sheet.</p><input id="file" type="file" accept="image/*"><div class="panel"><h3>🎨 Background</h3><div class="row"><label>Background Type<select id="bgType"><option value="white">White</option><option value="lightblue">Light Blue</option><option value="blue">Blue</option><option value="red">Red</option><option value="grey">Light Grey</option><option value="custom">Custom Color</option><option value="gradient">Soft Gradient</option><option value="transparent">Transparent</option><option value="image">Background Image</option></select></label><label id="bgColorWrap" class="hidden">Custom Color<input id="bgColor" type="color" value="#ffffff"></label></div><div id="bgImageWrap" class="hidden"><label>Background Image<input id="bgImage" type="file" accept="image/*"></label></div><button class="btn secondary" id="removeBg">✂️ Remove Background Automatically</button></div><div class="panel"><h3>📐 Photo & Layout</h3><div class="row"><label>Photo Size<select id="size"><option value="35x45">35 × 45 mm</option><option value="2x2">2 × 2 inch</option><option value="25x35">25 × 35 mm</option><option value="custom">Custom Size</option></select></label><label id="customSizeWrap" class="hidden">Custom W × H (mm)<input id="customSize" value="35x45" placeholder="35x45"></label></div><div class="row"><label>Photos per row<select id="layout"><option value="1">👤 Single Photo</option><option value="2">👥 2 Photos</option><option value="4">4 Photos</option><option value="5">5 Photos</option><option value="6">6 Photos</option><option value="custom">🔢 Custom 1–10</option></select></label><label id="customRowsWrap" class="hidden">Custom photos<input id="customRows" type="number" min="1" max="10" value="3"></label></div><div class="checks"><label><input id="guide" type="checkbox"> 👤 Face Position Guide</label><label><input id="border" type="checkbox"> 🖼️ Photo Border</label></div></div><div class="panel"><h3>🔍 Editor</h3><label>Zoom <input id="zoom" type="range" min="80" max="130" value="100"></label><p class="small">Zoom केवल framing के लिए है; photo को center में crop किया जाता है।</p><button class="btn secondary" id="center">🎯 Center / Reset Zoom</button><button class="btn secondary" id="preset">💾 Save Preset</button><button class="btn secondary" id="clearPreset">🧹 Clear Preset</button></div><div class="panel"><h3>📄 Print Sheet</h3><label>Paper<select id="paper"><option value="a4">A4</option><option value="4x6">4 × 6 inch</option><option value="5x7">5 × 7 inch</option><option value="photo">Photo Size</option></select></label><button class="btn" id="make">Create Sheet</button><button class="btn" id="print">🖨️ Print Preview</button><button class="btn" id="download" disabled>⬇️ Download JPG</button><button class="btn secondary" id="resetBg">↺ Reset</button></div><div class="status" id="status">Photo चुनें।</div><div class="studio" id="studio"><canvas id="canvas"></canvas><div class="guide"></div></div></div></main><script type="module">import{removeBackground as aiRemoveBackground}from'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';const $=id=>document.getElementById(id);const f=$('file'),size=$('size'),customSize=$('customSize'),customSizeWrap=$('customSizeWrap'),layout=$('layout'),customRows=$('customRows'),customRowsWrap=$('customRowsWrap'),paper=$('paper'),c=$('canvas'),ctx=c.getContext('2d'),s=$('status'),d=$('download'),bgType=$('bgType'),bgColor=$('bgColor'),bgColorWrap=$('bgColorWrap'),bgImage=$('bgImage'),bgImageWrap=$('bgImageWrap'),studio=$('studio'),zoom=$('zoom');let sourceFile=null,processedUrl=null,bgImageObj=null,cutoutBusy=false;const colors={white:'#fff',lightblue:'#dff1ff',blue:'#1976d2',red:'#e53935',grey:'#eee'};function controls(){bgColorWrap.classList.toggle('hidden',bgType.value!=='custom');bgImageWrap.classList.toggle('hidden',bgType.value!=='image');customSizeWrap.classList.toggle('hidden',size.value!=='custom');customRowsWrap.classList.toggle('hidden',layout.value!=='custom');studio.classList.toggle('showGuide',$('guide').checked)}function count(){return layout.value==='custom'?Math.max(1,Math.min(10,+customRows.value||1)):+layout.value}function dims(){const dpi=300;if(size.value==='35x45')return [Math.round(35/25.4*dpi),Math.round(45/25.4*dpi)];if(size.value==='2x2')return [600,600];if(size.value==='25x35')return [Math.round(25/25.4*dpi),Math.round(35/25.4*dpi)];const p=customSize.value.split('x').map(Number);return [Math.round((p[0]||35)/25.4*dpi),Math.round((p[1]||45)/25.4*dpi)]}async function cutout(){if(!sourceFile)return false;if(processedUrl)return true;if(cutoutBusy)return false;cutoutBusy=true;s.textContent='✂️ Background remove हो रहा है...';try{const blob=await aiRemoveBackground(sourceFile,{output:{format:'image/png'}});processedUrl=URL.createObjectURL(blob);cutoutBusy=false;return true}catch(e){console.error(e);cutoutBusy=false;s.textContent='❌ Background removal failed.';return false}}async function chooseBg(){controls();if(!sourceFile)return;if(bgType.value==='white'){processedUrl=null;return make()}if(await cutout())make()}bgType.onchange=chooseBg;bgColor.oninput=()=>{if(sourceFile&&bgType.value==='custom')chooseBg()};bgImage.onchange=()=>{if(!bgImage.files[0])return;const im=new Image();im.onload=()=>{bgImageObj=im;chooseBg()};im.src=URL.createObjectURL(bgImage.files[0])};layout.onchange=()=>{controls();if(sourceFile)make()};customRows.oninput=()=>{if(sourceFile&&layout.value==='custom')make()};size.onchange=()=>{controls();if(sourceFile)make()};zoom.oninput=()=>{if(sourceFile)make()};$('guide').onchange=controls;$('border').onchange=()=>{if(sourceFile)make()};f.onchange=()=>{sourceFile=f.files[0]||null;processedUrl=null;if(sourceFile)s.textContent='Photo selected. Settings चुनें।'};async function img(url){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=url})}function bg(x,y,w,h){if(bgType.value==='transparent')return;if(bgType.value==='image'&&bgImageObj){const sc=Math.max(w/bgImageObj.width,h/bgImageObj.height),sw=w/sc,sh=h/sc;ctx.drawImage(bgImageObj,(bgImageObj.width-sw)/2,(bgImageObj.height-sh)/2,sw,sh,x,y,w,h);return}if(bgType.value==='gradient'){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#fff');g.addColorStop(1,'#dff1ff');ctx.fillStyle=g}else ctx.fillStyle=bgType.value==='custom'?bgColor.value:(colors[bgType.value]||'#fff');ctx.fillRect(x,y,w,h)}async function make(){if(!sourceFile)return s.textContent='पहले photo चुनें।';if(bgType.value!=='white'&&!processedUrl){if(!(await cutout()))return}s.textContent='Sheet तैयार हो रही है...';const im=await img(processedUrl||URL.createObjectURL(sourceFile));const [w,h]=dims(),n=count(),gap=20;c.width=n*w+(n+1)*gap;c.height=h+2*gap;ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<n;i++){const x=gap+i*(w+gap),y=gap;bg(x,y,w,h);const z=+zoom.value/100,base=Math.max(w/im.width,h/im.height)*z,sw=w/base,sh=h/base,sx=Math.max(0,(im.width-sw)/2),sy=Math.max(0,(im.height-sh)/2);ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h);ctx.restore();if($('border').checked){ctx.strokeStyle='#222';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h)}}s.textContent=`✅ ${n} photo per row — preview ready.`;d.disabled=false}$('make').onclick=make;$('center').onclick=()=>{zoom.value=100;if(sourceFile)make()};$('resetBg').onclick=()=>{bgType.value='white';bgColor.value='#fff';bgImage.value='';bgImageObj=null;processedUrl=null;zoom.value=100;controls();if(sourceFile)make()};$('removeBg').onclick=async()=>{if(await cutout())s.textContent='✅ Background remove हो गया। नया background चुनें।';await make()};$('preset').onclick=()=>{localStorage.setItem('ajPassportPreset',JSON.stringify({size:size.value,customSize:customSize.value,layout:layout.value,customRows:customRows.value,bg:bgType.value,color:bgColor.value,paper:paper.value,border:$('border').checked}));s.textContent='💾 Preset saved.'};$('clearPreset').onclick=()=>{localStorage.removeItem('ajPassportPreset');s.textContent='🧹 Preset cleared.'};$('print').onclick=()=>{if(!c.width)return;const w=paper.value==='a4'?'210mm':paper.value==='4x6'?'152.4mm':paper.value==='5x7'?'177.8mm':dims()[0]/300*25.4+'mm';const h=paper.value==='a4'?'297mm':paper.value==='4x6'?'101.6mm':paper.value==='5x7'?'127mm':dims()[1]/300*25.4+'mm';const win=window.open('','_blank');win.document.write(`<html><head><title>AJ Passport Photo Print</title><style>@page{size:${w} ${h};margin:0}body{margin:0;text-align:center}img{width:100%;height:100%;object-fit:contain}</style></head><body><img src="${c.toDataURL('image/jpeg',.95)}"><script>window.onload=()=>window.print()<\/script></body></html>`);win.document.close()};d.onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download='AJ-DIGITAL-POINT-Passport-Photo.jpg';a.click()};try{const p=JSON.parse(localStorage.getItem('ajPassportPreset'));if(p){size.value=p.size||size.value;customSize.value=p.customSize||customSize.value;layout.value=p.layout||layout.value;customRows.value=p.customRows||customRows.value;bgType.value=p.bg||bgType.value;bgColor.value=p.color||bgColor.value;paper.value=p.paper||paper.value;$('border').checked=!!p.border}}catch(e){}controls();</script></body></html>
