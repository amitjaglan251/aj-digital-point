<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:900px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}input,select{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}canvas{max-width:100%;margin-top:15px;border:1px solid #ddd}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🪪 Passport Photo Maker</h1><p>Photo upload करें, size चुनें और ready-to-print sheet बनाएं।</p><input id="file" type="file" accept="image/*"><div class="row"><select id="size"><option value="35x45">35 × 45 mm</option><option value="2x2">2 × 2 inch</option><option value="25x35">25 × 35 mm</option></select><select id="cols"><option value="4">4 photos / row</option><option value="5">5 photos / row</option><option value="6">6 photos / row</option></select></div><button class="btn" id="make">Create Photo Sheet</button><button class="btn" id="download" disabled>⬇️ Download JPG</button><div class="status" id="status">Photo चुनें।</div><canvas id="canvas"></canvas></div></main><script>const f=document.getElementById('file'),size=document.getElementById('size'),cols=document.getElementById('cols'),c=document.getElementById('canvas'),ctx=c.getContext('2d'),s=document.getElementById('status'),d=document.getElementById('download');document.getElementById('make').onclick=()=>{if(!f.files[0])return s.textContent='पहले photo चुनें।';const im=new Image();im.onload=()=>{let w,h;const dpi=300;if(size.value==='35x45'){w=Math.round(35/25.4*dpi);h=Math.round(45/25.4*dpi)}else if(size.value==='2x2'){w=h=2*dpi}else{w=Math.round(25/25.4*dpi);h=Math.round(35/25.4*dpi)}const n=Number(cols.value),gap=20;c.width=n*w+(n+1)*gap;c.height=h+2*gap;ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);for(let i=0;i<n;i++){const x=gap+i*(w+gap),y=gap;const scale=Math.max(w/im.width,h/im.height);const sw=w/scale,sh=h/scale;const sx=(im.width-sw)/2,sy=(im.height-sh)/2;ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}s.textContent='Photo sheet तैयार है।';d.disabled=false};im.src=URL.createObjectURL(f.files[0])};d.onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download='AJ-DIGITAL-POINT-Passport-Photo.jpg';a.click()};</script></body></html>
