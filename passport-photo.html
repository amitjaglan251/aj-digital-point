<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker | AJ DIGITAL POINT</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="enhancements.css"><style>main{max-width:900px;margin:25px auto;padding:16px}.box{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:22px;box-shadow:0 5px 18px #0001}.btn{border:0;border-radius:9px;padding:11px 16px;margin:8px 5px 0 0;font-weight:700;cursor:pointer;background:#0b4ea2;color:#fff}.btn.secondary{background:#555}.status{margin-top:15px;padding:10px;background:#f3f7fb;border-radius:8px}.panel{margin-top:14px;padding:15px;border:1px solid #dce5ef;border-radius:12px;background:#fafcff}input,select{padding:10px;width:100%;margin-top:8px;box-sizing:border-box}canvas{max-width:100%;margin-top:15px;border:1px solid #ddd}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.swatches button{width:42px;height:32px;border:2px solid #ddd;border-radius:7px;cursor:pointer}.small{font-size:12px;color:#666}@media(max-width:600px){.row{grid-template-columns:1fr}}</style></head><body><main><a href="tools-center.html">← Tools Center</a><div class="box"><h1>🪪 Passport Photo Maker</h1><p>Photo upload करें, background बदलें, size चुनें और ready-to-print sheet बनाएं।</p><input id="file" type="file" accept="image/*"><div class="panel"><h3>🎨 Background</h3><div class="row"><label>Background Type<select id="bgType"><option value="white">White</option><option value="lightblue">Light Blue</option><option value="blue">Blue</option><option value="red">Red</option><option value="grey">Light Grey</option><option value="custom">Custom Color</option><option value="gradient">Soft Gradient</option><option value="transparent">Transparent</option><option value="image">Background Image</option></select></label><label id="bgColorWrap" class="hidden">Custom Color<input id="bgColor" type="color" value="#ffffff"></label></div><div id="bgImageWrap" class="hidden"><label>Background Image<input id="bgImage" type="file" accept="image/*"></label></div><div class="swatches"><button title="White" data-bg="#ffffff" style="background:#fff"></button><button title="Light Blue" data-bg="#dff1ff" style="background:#dff1ff"></button><button title="Blue" data-bg="#1976d2" style="background:#1976d2"></button><button title="Red" data-bg="#e53935" style="background:#e53935"></button><button title="Grey" data-bg="#eeeeee" style="background:#eee"></button></div><p class="small">पहले background चुनें, फिर Create Photo Sheet दबाएं। Background preview और downloaded JPG दोनों में लागू होगा।</p><button class="btn secondary" id="removeBg">✂️ Remove Background Automatically</button></div><div class="row"><select id="size"><option value="35x45">35 × 45 mm</option><option value="2x2">2 × 2 inch</option><option value="25x35">25 × 35 mm</option></select><select id="cols"><option value="4">4 photos / row</option><option value="5">5 photos / row</option><option value="6">6 photos / row</option></select></div><button class="btn" id="make">Create Photo Sheet</button><button class="btn" id="download" disabled>⬇️ Download JPG</button><button class="btn secondary" id="resetBg">↺ Reset Background</button><div class="status" id="status">Photo चुनें।</div><canvas id="canvas"></canvas></div></main><script type="module">import {removeBackground as aiRemoveBackground} from 'https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm';const f=document.getElementById('file'),size=document.getElementById('size'),cols=document.getElementById('cols'),c=document.getElementById('canvas'),ctx=c.getContext('2d'),s=document.getElementById('status'),d=document.getElementById('download'),bgType=document.getElementById('bgType'),bgColor=document.getElementById('bgColor'),bgColorWrap=document.getElementById('bgColorWrap'),bgImage=document.getElementById('bgImage'),bgImageWrap=document.getElementById('bgImageWrap');let sourceFile=null,processedUrl=null,bgImageObj=null;const bgColors={white:'#ffffff',lightblue:'#dff1ff',blue:'#1976d2',red:'#e53935',grey:'#eeeeee'};function showBgControls(){bgColorWrap.classList.toggle('hidden',bgType.value!=='custom');bgImageWrap.classList.toggle('hidden',bgType.value!=='image')}function setTypeAndRender(type,color){bgType.value=type;if(color)bgColor.value=color;showBgControls();if(sourceFile)createSheet()}bgType.onchange=()=>{showBgControls();if(sourceFile)createSheet()};bgColor.oninput=()=>{if(sourceFile&&bgType.value==='custom')createSheet()};bgImage.onchange=()=>{if(!bgImage.files[0])return;const im=new Image();im.onload=()=>{bgImageObj=im;createSheet()};im.src=URL.createObjectURL(bgImage.files[0])};document.querySelectorAll('.swatches button').forEach(b=>b.onclick=()=>setTypeAndRender('custom',b.dataset.bg));f.onchange=()=>{sourceFile=f.files[0]||null;processedUrl=null;if(sourceFile){s.textContent='Photo selected. Background चुनें और Create Photo Sheet दबाएं।';}else{s.textContent='Photo चुनें।'}};function drawBackground(x,y,w,h){const t=bgType.value;if(t==='transparent')return;if(t==='image'&&bgImageObj){const scale=Math.max(w/bgImageObj.width,h/bgImageObj.height),sw=w/scale,sh=h/scale;ctx.drawImage(bgImageObj,(bgImageObj.width-sw)/2,(bgImageObj.height-sh)/2,sw,sh,x,y,w,h);return}if(t==='gradient'){const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#dff1ff');ctx.fillStyle=g}else{ctx.fillStyle=t==='custom'?bgColor.value:(bgColors[t]||'#fff')}ctx.fillRect(x,y,w,h)}function loadImage(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url})}async function createSheet(){if(!sourceFile)return s.textContent='पहले photo चुनें।';s.textContent='Photo sheet तैयार हो रही है...';const im=await loadImage(processedUrl||URL.createObjectURL(sourceFile));let w,h;const dpi=300;if(size.value==='35x45'){w=Math.round(35/25.4*dpi);h=Math.round(45/25.4*dpi)}else if(size.value==='2x2'){w=h=2*dpi}else{w=Math.round(25/25.4*dpi);h=Math.round(35/25.4*dpi)}const n=Number(cols.value),gap=20;c.width=n*w+(n+1)*gap;c.height=h+2*gap;ctx.clearRect(0,0,c.width,c.height);if(bgType.value!=='transparent'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}for(let i=0;i<n;i++){const x=gap+i*(w+gap),y=gap;drawBackground(x,y,w,h);const scale=Math.max(w/im.width,h/im.height),sw=w/scale,sh=h/scale,sx=(im.width-sw)/2,sy=(im.height-sh)/2;ctx.drawImage(im,sx,sy,sw,sh,x,y,w,h)}s.textContent='✅ Background successfully applied — preview ready.';d.disabled=false}document.getElementById('make').onclick=createSheet;document.getElementById('resetBg').onclick=()=>{bgType.value='white';bgColor.value='#ffffff';bgImage.value='';bgImageObj=null;showBgControls();if(sourceFile)createSheet()};document.getElementById('removeBg').onclick=async()=>{if(!sourceFile)return s.textContent='पहले photo चुनें।';try{s.textContent='✂️ Background remove हो रहा है... पहली बार model download होने में समय लग सकता है।';const blob=await aiRemoveBackground(sourceFile,{output:{format:'image/png'}});processedUrl=URL.createObjectURL(blob);s.textContent='✅ Background remove हो गया। अब नया background चुनकर Create Photo Sheet दबाएं।';await createSheet()}catch(e){console.error(e);s.textContent='❌ Automatic background removal इस browser/device पर पूरा नहीं हो सका।';}};d.onclick=()=>{const a=document.createElement('a');a.href=c.toDataURL('image/jpeg',.95);a.download='AJ-DIGITAL-POINT-Passport-Photo.jpg';a.click()};showBgControls();</script></body></html>
