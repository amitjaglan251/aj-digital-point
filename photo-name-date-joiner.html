<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Name Date Joiner | AJ DIGITAL POINT</title><meta name="description" content="AJ DIGITAL POINT Photo Name Date Joiner से photo के साथ name और date जोड़कर printable image बनाएं।"><meta name="robots" content="index,follow"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/photo-name-date-joiner.html"><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.top{background:#0b4ea2;color:#fff;padding:15px 5%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:28px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 25px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ccd4df}button{background:#0b4ea2;color:#fff;font-weight:800;cursor:pointer}.preview{margin-top:20px;max-width:100%}.note{color:#657086;line-height:1.6}</style><style id="easy-back-nav">.easy-back{display:flex;gap:8px;align-items:center;margin:8px auto;max-width:1200px;padding:0 16px;font-size:13px}.easy-back a{color:#123f80;font-weight:800;text-decoration:none}.easy-back a:hover{text-decoration:underline}</style></head><body><header class="top"><a href="index.html">AJ DIGITAL POINT</a><a href="online-tools.html">← Tools</a></header><main class="wrap"><div class="easy-back"><a href="online-tools.html">← Online Tools</a><span>›</span><b>वापस जाना</b></div><div class="card"><h1>📝 Photo, Name & Date Joiner</h1><p class="note">Photo के नीचे name और date जोड़कर एक printable image बनाएं।</p><input id="photo" type="file" accept="image/*"><input id="name" maxlength="80" placeholder="Name"><input id="date" type="date"><button id="make">Create Image</button><a id="download" style="display:none"><button>⬇️ Download Image</button></a><canvas id="canvas" class="preview"></canvas></div></main><script>const $=id=>document.getElementById(id);let inputUrl='',outputUrl='';$('make').onclick=()=>{const f=$('photo').files[0];if(!f)return alert('पहले photo चुनें।');const im=new Image();im.onload=()=>{const c=$('canvas'),g=c.getContext('2d'),pad=30,box=95;c.width=im.width;c.height=im.height+box;g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);g.fillStyle='#172033';g.font='bold 28px system-ui';g.fillText($('name').value||'Name',pad,im.height+38);g.font='22px system-ui';g.fillText($('date').value||new Date().toLocaleDateString('en-IN'),pad,im.height+72);c.toBlob(b=>{if(!b){alert('Image नहीं बन सकी।');return}if(outputUrl)URL.revokeObjectURL(outputUrl);outputUrl=URL.createObjectURL(b);$('download').href=outputUrl;$('download').download='AJ-Digital-Point-photo-name-date.png';$('download').style.display='block'},'image/png')};if(inputUrl)URL.revokeObjectURL(inputUrl);inputUrl=URL.createObjectURL(f);im.src=inputUrl}window.addEventListener('beforeunload',()=>{if(inputUrl)URL.revokeObjectURL(inputUrl);if(outputUrl)URL.revokeObjectURL(outputUrl)});</script></body></html>
