<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photo Name Date Joiner | AJ DIGITAL POINT</title><meta name="description" content="AJ DIGITAL POINT Photo Name Date Joiner से photo के साथ name और date जोड़कर printable image बनाएं।"><link rel="canonical" href="https://amitjaglan251.github.io/aj-digital-point/photo-name-date-joiner.html"><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.top{background:#0b4ea2;color:#fff;padding:15px 5%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:28px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 25px #0001}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:10px;border-radius:10px;border:1px solid #ccd4df}button{background:#0b4ea2;color:#fff;font-weight:800;cursor:pointer}.preview{margin-top:20px;max-width:100%}.note{color:#657086;line-height:1.6}</style></head><body><header class="top"><a href="index.html">AJ DIGITAL POINT</a><a href="online-tools.html">← Tools</a></header><main class="wrap"><div class="card"><h1>📝 Photo, Name & Date Joiner</h1><p class="note">Photo के नीचे name और date जोड़कर एक printable image बनाएं।</p><input id="photo" type="file" accept="image/*"><input id="name" maxlength="80" placeholder="Name"><input id="date" type="date"><button id="make">Create Image</button><a id="download" style="display:none"><button>⬇️ Download Image</button></a><canvas id="canvas" class="preview"></canvas></div></main><script>const $=id=>document.getElementById(id);$('make').onclick=()=>{const f=$('photo').files[0];if(!f)return alert('पहले photo चुनें।');const im=new Image();im.onload=()=>{const c=$('canvas'),g=c.getContext('2d'),pad=30,box=95;c.width=im.width;c.height=im.height+box;g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0);g.fillStyle='#172033';g.font='bold 28px system-ui';g.fillText($('name').value||'Name',pad,im.height+38);g.font='22px system-ui';g.fillText($('date').value||new Date().toLocaleDateString('en-IN'),pad,im.height+72);c.toBlob(b=>{const u=URL.createObjectURL(b);$('download').href=u;$('download').download='AJ-Digital-Point-photo-name-date.png';$('download').style.display='block'},'image/png')};im.src=URL.createObjectURL(f)}</script></body></html>
