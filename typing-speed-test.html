<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typing Speed Test | AJ DIGITAL POINT</title><style>body{font-family:system-ui;margin:0;background:#f4f7fb;color:#172033}.top{background:#0b4ea2;color:#fff;padding:15px 5%;display:flex;justify-content:space-between}.top a{color:#fff;text-decoration:none;font-weight:800}.wrap{max-width:850px;margin:28px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 25px #0001}.sample{background:#eef6ff;padding:16px;border-radius:12px;line-height:1.7}textarea{width:100%;height:150px;box-sizing:border-box;padding:13px;border:1px solid #ccd4df;border-radius:10px;margin-top:14px;font-size:16px}button{padding:12px 18px;border:0;border-radius:10px;background:#0b4ea2;color:#fff;font-weight:800;margin-top:12px}.stats{display:flex;gap:20px;flex-wrap:wrap;margin-top:15px}.stats b{font-size:22px;display:block}.note{color:#657086}</style></head><body><header class="top"><a href="index.html">AJ DIGITAL POINT</a><a href="online-tools.html">← Tools</a></header><main class="wrap"><div class="card"><h1>⌨️ Typing Speed Test</h1><p class="note">Start दबाएँ, फिर sample देखकर नीचे type करें।</p><div class="sample" id="sample">The quick brown fox jumps over the lazy dog. Practice makes typing faster and more accurate.</div><textarea id="text" placeholder="यहाँ typing शुरू करें..." disabled></textarea><button id="start">Start Test</button><div class="stats"><div><b id="time">60</b>Seconds</div><div><b id="wpm">0</b>WPM</div><div><b id="acc">100%</b>Accuracy</div></div></div></main><script>const sample=document.getElementById('sample').textContent.trim(),t=document.getElementById('text'),start=document.getElementById('start'),time=document.getElementById('time'),wpm=document.getElementById('wpm'),acc=document.getElementById('acc');let left=60,timer=null,started=false;start.onclick=()=>{clearInterval(timer);left=60;started=true;t.disabled=false;t.value='';t.focus();time.textContent=left;wpm.textContent=0;acc.textContent='100%';start.textContent='Restart Test';timer=setInterval(()=>{left--;time.textContent=left;calc();if(left<=0){clearInterval(timer);t.disabled=true}},1000)};function calc(){const typed=t.value;let correct=0;for(let i=0;i<typed.length;i++)if(typed[i]===sample[i])correct++;const elapsed=60-left;const minutes=Math.max(elapsed/60,.0167);wpm.textContent=Math.round((correct/5)/minutes);acc.textContent=(typed.length?Math.round(correct/typed.length*100):100)+'%';if(typed.length>=sample.length){clearInterval(timer);t.disabled=true}}t.addEventListener('input',calc)</script></body></html>
